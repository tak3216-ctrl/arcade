<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAME CENTER TAK</title>
<meta name="description" content="ゲームセンターの筐体から遊べる置き場。できたものを順次公開。">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ai:#070A18; --kin:#FFC94A; --momo:#FF4E86; --sui:#3FE0E0;
  --shiro:#F2F1EA; --muted:#8E97C0;
  --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  --util:"DotGothic16",monospace;
  --rx:6deg; --ry:0deg; --z:-560px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ai);
  color:var(--shiro);font-family:var(--body);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--kin);outline-offset:3px}

/* ===== 3Dステージ ===== */
#stage{position:fixed;inset:0;perspective:1150px;perspective-origin:50% 46%;
  cursor:grab;touch-action:none;background:
    radial-gradient(120% 90% at 50% 25%,#101838 0%,#070A18 70%)}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:50%;top:50%;width:0;height:0;
  transform-style:preserve-3d;
  transform:translateZ(var(--z)) rotateX(var(--rx)) rotateY(var(--ry)) translateY(300px)}
.face{position:absolute;left:50%;top:50%;transform-style:preserve-3d;backface-visibility:visible}

/* 部屋 */
.floor{background:
    repeating-linear-gradient(0deg,rgba(80,104,200,.16) 0 1px,transparent 1px 80px),
    repeating-linear-gradient(90deg,rgba(80,104,200,.16) 0 1px,transparent 1px 80px),
    radial-gradient(60% 50% at 50% 40%,#252F63 0%,#141A3C 100%)}
.wall{background:linear-gradient(180deg,#0E1330 0%,#1A2148 70%,#232C5C 100%)}
.ceiling{background:linear-gradient(180deg,#0A0E24,#0D1230)}

/* 蛍光灯 */
.tube{position:absolute;left:50%;width:620px;height:16px;margin-left:-310px;
  background:#CBD6FF;border-radius:3px;
  box-shadow:0 0 40px 18px rgba(160,180,255,.32),0 0 120px 60px rgba(120,145,255,.14)}

/* ネオン看板 */
.neon{position:absolute;left:50%;top:50%;font-family:var(--util);
  letter-spacing:.16em;white-space:nowrap;transform-style:preserve-3d;
  animation:flick 5.5s infinite}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.55}98%{opacity:1}99%{opacity:.7}}

/* 筐体 */
.cab{position:absolute;left:50%;top:50%;transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.cab .panelface{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.screen{position:absolute;left:50%;top:50%;overflow:hidden;
  background:linear-gradient(180deg,#0A0F26,#182046);
  box-shadow:inset 0 0 26px rgba(0,0,0,.85)}
.screen::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px)}
.screen .st{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;text-align:center;padding:8px}
.screen .kind{font-family:var(--util);font-size:9px;letter-spacing:.16em;color:var(--muted)}
.screen .nm{font-weight:900;font-size:17px;line-height:1.3}
.screen .ps{font-family:var(--util);font-size:10px;letter-spacing:.14em;animation:blink 1.6s steps(1) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
.marquee{position:absolute;left:50%;top:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--util);letter-spacing:.14em;color:#111;font-size:11px}
.coin{position:absolute;left:50%;top:50%;background:#8E97C0;border-radius:1px}
.stick{position:absolute;left:50%;top:50%}
.knob{position:absolute;left:50%;top:50%;border-radius:50%}
.btn{position:absolute;left:50%;top:50%;border-radius:50%;box-shadow:0 0 10px currentColor}
.wheel{position:absolute;left:50%;top:50%;border:9px solid #12183A;border-radius:50%;
  background:transparent;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.strip{position:absolute;left:50%;top:50%;border-radius:2px}

.hit{position:absolute;left:50%;top:50%;cursor:pointer;background:transparent}

/* ===== HUD ===== */
.hud{position:fixed;z-index:10;pointer-events:none}
.hud>*{pointer-events:auto}
#top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:18px clamp(16px,4vw,34px);background:linear-gradient(180deg,rgba(7,10,24,.9),transparent)}
.logo{font-family:var(--util);font-size:14px;letter-spacing:.22em;color:var(--kin);
  text-shadow:0 0 16px rgba(255,201,74,.6)}
.logo small{display:block;font-size:10px;letter-spacing:.16em;color:var(--muted);text-shadow:none;margin-top:3px}
.ghost{font-family:var(--util);font-size:11px;letter-spacing:.14em;color:var(--muted);
  background:rgba(20,26,54,.7);border:1px solid rgba(142,151,192,.32);border-radius:2px;
  padding:8px 14px;cursor:pointer;transition:.2s}
.ghost:hover{color:var(--shiro);border-color:var(--kin)}
#hint{bottom:18px;left:50%;transform:translateX(-50%);text-align:center;
  font-family:var(--util);font-size:11px;letter-spacing:.14em;color:var(--muted);
  background:rgba(7,10,24,.65);padding:8px 16px;border-radius:2px}
#hint b{color:var(--kin)}

#sheet{position:fixed;z-index:20;inset:auto 0 0 0;display:none;justify-content:center;padding:0 16px 22px}
#sheet.on{display:flex}
.card{width:min(460px,100%);background:rgba(14,19,44,.97);border:1px solid rgba(255,201,74,.4);
  border-radius:4px;padding:22px 24px 24px;animation:rise .32s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.card .kind{font-family:var(--util);font-size:11px;letter-spacing:.18em;color:var(--kin)}
.card h2{margin:8px 0 0;font-size:22px;font-weight:900}
.card p{margin:12px 0 0;font-size:14px;line-height:1.8;color:#B6BEDF}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{font-family:var(--util);font-size:10px;letter-spacing:.08em;color:var(--muted);
  border:1px solid rgba(142,151,192,.34);padding:2px 8px;border-radius:2px}
.acts{display:flex;gap:10px;margin-top:20px}
.play{flex:1;text-align:center;font-family:var(--util);font-size:13px;letter-spacing:.16em;
  background:var(--kin);color:#111;padding:12px;border-radius:2px;text-decoration:none;transition:.2s}
.play:hover{background:var(--momo);color:#fff}
.close{font-family:var(--util);font-size:12px;letter-spacing:.12em;color:var(--muted);
  background:none;border:1px solid rgba(142,151,192,.34);border-radius:2px;padding:12px 16px;cursor:pointer}

#list{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--ai);display:none;
  padding:clamp(24px,6vw,72px) clamp(16px,5vw,64px)}
#list.on{display:block}
#list h1{font-size:clamp(24px,4vw,36px);font-weight:900;margin:0 0 6px}
#list .sub{font-family:var(--util);font-size:12px;letter-spacing:.14em;color:var(--muted);margin:0 0 40px}
.rows{display:grid;gap:14px;max-width:820px}
.row{display:flex;gap:18px;align-items:flex-start;border:1px solid rgba(142,151,192,.22);
  border-left:3px solid var(--kin);border-radius:3px;padding:20px 22px;background:rgba(20,26,54,.5)}
.row .kind{font-family:var(--util);font-size:10px;letter-spacing:.16em;color:var(--kin);min-width:96px;padding-top:5px}
.row h3{margin:0;font-size:18px;font-weight:900}
.row p{margin:8px 0 0;font-size:14px;color:#B6BEDF;line-height:1.75}
.row .play{display:inline-block;flex:none;margin-top:14px;padding:9px 20px}
#list .back{margin-top:44px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="stage" role="application" aria-label="3Dゲームセンター。筐体を選ぶとゲームが開きます">
  <div id="world"></div>
</div>

<div class="hud" id="top">
  <div class="logo">GAME CENTER TAK<small>ARCADE FOR MY GAMES</small></div>
  <button class="ghost" id="toList">一覧で見る</button>
</div>
<div class="hud" id="hint"><b>ドラッグ</b>で見回す ／ <b>ホイール</b>で寄る ／ <b>筐体をクリック</b>で遊ぶ</div>

<div id="sheet"><div class="card" id="card"></div></div>

<div id="list">
  <h1>置いてあるゲーム</h1>
  <p class="sub">2 CABINETS / 無料 / ブラウザで動きます</p>
  <div class="rows" id="rows"></div>
  <button class="ghost back" id="toStage">3Dの店内に戻る</button>
</div>

<script>
/* ==========================================================
   ゲーム定義 — ここを増やすと筐体と一覧が両方増えます
   type: 'race' | 'upright' ／ x,rot = 店内での立ち位置
   ========================================================== */
var GAMES = [
  { type:'race', kindLabel:'RACING CABINET', title:'V RACER',
    desc:'コースを駆け抜けるレースゲーム。ハンドルを握って最速タイムを狙ってください。',
    tags:['レース','3D'], url:'./games/Vracer/index.html',
    color:'#3FE0E0', x:-430, z:-40, rot:20 },

  { type:'upright', kindLabel:'UPRIGHT CABINET', title:'BALLOON',
    desc:'風船でどこまでも上昇していくゲーム。障害物をよけながら高度を稼ぎます。',
    tags:['アクション','上昇'], url:'./games/balloon/index.html',
    color:'#FF4E86', x:70, z:20, rot:-4 },

  { type:'upright', kindLabel:'UPRIGHT CABINET', title:'CLIMB',
    desc:'ジャンプで足場を登っていくアクション。落ちないように上を目指してください。',
    tags:['アクション','ジャンプ'], url:'./games/climb/index.html',
    color:'#FFC94A', x:450, z:-40, rot:-24 }
];

/* ---------- 部品ヘルパー ---------- */
var world = document.getElementById('world');

function el(cls, css, parent){
  var d = document.createElement('div');
  d.className = cls || '';
  if (css) for (var k in css) d.style[k] = css[k];
  (parent || world).appendChild(d);
  return d;
}
// 中心が親原点に来るように置く面
function face(cls, w, h, tf, parent, css){
  var d = el('face ' + (cls||''), css, parent);
  d.style.width = w + 'px';
  d.style.height = h + 'px';
  d.style.marginLeft = (-w/2) + 'px';
  d.style.marginTop = (-h/2) + 'px';
  d.style.transform = tf;
  return d;
}
// 直方体（原点＝底面中央）
function box(w, h, d, x, y, z, color, parent, shade){
  var g = el('face', {width:'0',height:'0',transform:'translate3d('+x+'px,'+y+'px,'+z+'px)'}, parent);
  var dark = shade || 0.72;
  function shadeOf(f){
    return 'linear-gradient(180deg,'+color+','+color+')';
  }
  face('', w, h, 'translate3d(0,'+(-h/2)+'px,'+(d/2)+'px)', g,
    {background:color});
  face('', w, h, 'translate3d(0,'+(-h/2)+'px,'+(-d/2)+'px) rotateY(180deg)', g,
    {background:color, filter:'brightness(.6)'});
  face('', d, h, 'translate3d('+(-w/2)+'px,'+(-h/2)+'px,0) rotateY(-90deg)', g,
    {background:color, filter:'brightness(.78)'});
  face('', d, h, 'translate3d('+(w/2)+'px,'+(-h/2)+'px,0) rotateY(90deg)', g,
    {background:color, filter:'brightness(.78)'});
  face('', w, d, 'translate3d(0,'+(-h)+'px,0) rotateX(90deg)', g,
    {background:color, filter:'brightness(1.22)'});
  return g;
}

/* ---------- 部屋 ---------- */
var RW = 1700, RD = 1300, RH = 640;   // 幅・奥行・高さ
face('floor', RW, RD, 'translate3d(0,0,'+(-RD/2+RD/2)+'px) rotateX(90deg)', world);
face('wall', RW, RH, 'translate3d(0,'+(-RH/2)+'px,'+(-RD/2)+'px)', world);
face('wall', RD, RH, 'translate3d('+(-RW/2)+'px,'+(-RH/2)+'px,0) rotateY(90deg)', world,
  {filter:'brightness(.8)'});
face('wall', RD, RH, 'translate3d('+(RW/2)+'px,'+(-RH/2)+'px,0) rotateY(-90deg)', world,
  {filter:'brightness(.8)'});
face('ceiling', RW, RD, 'translate3d(0,'+(-RH)+'px,0) rotateX(90deg)', world);

// 天井の蛍光灯（3本）
[-320, 0, 320].forEach(function(z){
  face('', 620, 16, 'translate3d(0,'+(-RH+26)+'px,'+z+'px) rotateX(90deg)', world,
    {background:'#CBD6FF', borderRadius:'3px',
     boxShadow:'0 0 44px 20px rgba(160,180,255,.30), 0 0 130px 70px rgba(120,145,255,.12)'});
});

// 床の光だまり（蛍光灯の落ち影）
[-320, 0, 320].forEach(function(z){
  face('', 760, 300, 'translate3d(0,-2px,'+z+'px) rotateX(90deg)', world,
    {background:'radial-gradient(50% 50% at 50% 50%,rgba(170,190,255,.13),transparent 70%)'});
});

/* ---------- ネオン看板 ---------- */
function neon(text, color, size, x, y, z, ry){
  var d = el('neon', {
    fontSize: size + 'px',
    color: color,
    textShadow: '0 0 8px '+color+', 0 0 24px '+color+', 0 0 60px '+color,
    transform: 'translate3d('+x+'px,'+y+'px,'+z+'px) rotateY('+(ry||0)+'deg) translate(-50%,-50%)'
  });
  d.textContent = text;
  return d;
}
neon('GAME CENTER TAK', '#FFC94A', 46, 0, -470, -RD/2+6, 0);
neon('PRIZE',    '#8A7BFF', 26, -RW/2+6, -400, -180,  90);
neon('OPEN 24H', '#3FE0E0', 26,  RW/2-6, -400, -180, -90);

/* ---------- 筐体 ---------- */
var cabs = [];

function buildCabinet(g){
  var root = el('cab', {transform:'translate3d('+g.x+'px,0,'+g.z+'px) rotateY('+g.rot+'deg)'});
  root.dataset.game = '1';
  root._game = g;
  root._base = 'translate3d('+g.x+'px,0,'+g.z+'px) rotateY('+g.rot+'deg)';

  var shell = '#242C5C';

  if (g.type === 'upright'){
    var W = 150, H = 310, D = 110;
    box(W, H, D, 0, 0, 0, shell, root);
    // マーキー
    var mq = face('marquee', W-8, 52, 'translate3d(0,'+(-H+18)+'px,'+(D/2+2)+'px)', root,
      {background:g.color, boxShadow:'0 0 26px '+g.color});
    mq.textContent = g.title;
    // 画面
    var sc = face('screen', 118, 92, 'translate3d(0,'+(-H+108)+'px,'+(D/2+2)+'px) rotateX(-7deg)', root);
    sc.innerHTML = '<div class="st"><span class="kind">'+g.kindLabel+'</span>'+
      '<span class="nm" style="text-shadow:0 0 14px '+g.color+'">'+g.title+'</span>'+
      '<span class="ps" style="color:'+g.color+'">PRESS START</span></div>';
    // 操作パネル（前に張り出して傾く）
    box(W, 16, 72, 0, -152, D/2+18, '#303A72', root);
    face('knob', 18, 18, 'translate3d(-34px,-172px,'+(D/2+26)+'px)', root,
      {background:'#FF4E86', boxShadow:'0 0 12px #FF4E86'});
    face('stick', 8, 26, 'translate3d(-34px,-160px,'+(D/2+26)+'px)', root, {background:'#12183A'});
    ['#FFC94A','#3FE0E0','#FFC94A'].forEach(function(c,i){
      face('btn', 15, 15, 'translate3d('+(6+i*22)+'px,-166px,'+(D/2+26)+'px) rotateX(-70deg)', root,
        {background:c, color:c});
    });
    // コイン投入口
    face('coin', 34, 9, 'translate3d(0,-92px,'+(D/2+2)+'px)', root, {background:'#8E97C0'});
    // サイドネオン
    [-W/2+3, W/2-3].forEach(function(x){
      face('strip', 6, H-60, 'translate3d('+x+'px,'+(-H/2)+'px,'+(D/2+2)+'px)', root,
        {background:g.color, boxShadow:'0 0 18px '+g.color});
    });
    // 当たり判定
    face('hit', W+30, H, 'translate3d(0,'+(-H/2)+'px,'+(D/2+40)+'px)', root);

  } else {
    var W2 = 210, H2 = 200, D2 = 130;
    box(W2, H2, D2, 0, 0, -60, shell, root);                       // スクリーン筐体
    var mq2 = face('marquee', W2-16, 46, 'translate3d(0,'+(-H2-6)+'px,'+(-60+D2/2+2)+'px)', root,
      {background:g.color, boxShadow:'0 0 26px '+g.color});
    mq2.textContent = g.title;
    var sc2 = face('screen', 168, 112, 'translate3d(0,'+(-H2+68)+'px,'+(-60+D2/2+2)+'px)', root);
    sc2.innerHTML = '<div class="st"><span class="kind">'+g.kindLabel+'</span>'+
      '<span class="nm" style="text-shadow:0 0 14px '+g.color+'">'+g.title+'</span>'+
      '<span class="ps" style="color:'+g.color+'">PRESS START</span></div>';
    box(W2, 22, 56, 0, -62, 30, '#303A72', root);                  // ダッシュ
    face('wheel', 46, 46, 'translate3d(0,-78px,58px) rotateX(-62deg)', root);   // ハンドル
    box(96, 16, 96, 0, -50, 138, '#3A1F52', root);                 // 座面
    box(96, 104, 18, 0, -152, 182, '#3A1F52', root);               // 背もたれ
    face('strip', 96, 10, 'translate3d(0,-158px,174px)', root,
      {background:g.color, boxShadow:'0 0 16px '+g.color});        // ヘッドレスト帯
    face('strip', W2, 8, 'translate3d(0,-8px,'+(-60+D2/2+4)+'px) rotateX(90deg)', root,
      {background:g.color, boxShadow:'0 0 22px '+g.color});        // 足元ネオン
    face('hit', W2+30, H2+60, 'translate3d(0,'+(-H2/2)+'px,'+(D2/2+70)+'px)', root);
  }

  // 筐体まわりの床の照り返し
  face('', 320, 260, 'translate3d('+g.x+'px,-3px,'+(g.z+90)+'px) rotateX(90deg)', world,
    {background:'radial-gradient(50% 50% at 50% 50%,'+g.color+'44,transparent 70%)'});

  cabs.push(root);
}
GAMES.forEach(buildCabinet);

// 奥の空き筐体（今後増える場所）
[-720, 720].forEach(function(x){
  var g2 = el('cab', {transform:'translate3d('+x+'px,0,-330px) rotateY('+(x<0?34:-34)+'deg)'});
  box(140, 290, 100, 0, 0, 0, '#1A2044', g2);
  face('marquee', 132, 44, 'translate3d(0,-272px,52px)', g2,
    {background:'#2A3470', color:'#8E97C0'}).textContent = 'COMING SOON';
});

/* ---------- 視点操作 ---------- */
var stage = document.getElementById('stage');
var rx = 6, ry = 0, z = -560, trx = 6, try_ = 0, tz = -560;
var dragging = false, px = 0, py = 0, moved = 0;

stage.addEventListener('pointerdown', function(e){
  dragging = true; moved = 0; px = e.clientX; py = e.clientY;
  stage.classList.add('drag');
});
window.addEventListener('pointerup', function(){ dragging = false; stage.classList.remove('drag'); });
window.addEventListener('pointermove', function(e){
  if (!dragging) return;
  var dx = e.clientX - px, dy = e.clientY - py;
  moved += Math.abs(dx) + Math.abs(dy);
  try_ += dx * 0.16;
  trx  -= dy * 0.10;
  try_ = Math.max(-42, Math.min(42, try_));
  trx  = Math.max(-6, Math.min(26, trx));
  px = e.clientX; py = e.clientY;
});
stage.addEventListener('wheel', function(e){
  e.preventDefault();
  tz = Math.max(-1000, Math.min(-160, tz - e.deltaY * 0.6));
}, {passive:false});

(function loop(){
  rx += (trx - rx) * 0.09;
  ry += (try_ - ry) * 0.09;
  z  += (tz - z) * 0.09;
  var s = document.documentElement.style;
  s.setProperty('--rx', rx.toFixed(2) + 'deg');
  s.setProperty('--ry', ry.toFixed(2) + 'deg');
  s.setProperty('--z', z.toFixed(1) + 'px');
  requestAnimationFrame(loop);
})();

/* ---------- 筐体のホバーとクリック ---------- */
cabs.forEach(function(root){
  var hit = root.querySelector('.hit');
  hit.addEventListener('pointerenter', function(){
    root.style.transform = root._base + ' translateY(-14px)';
    root.style.filter = 'brightness(1.18)';
  });
  hit.addEventListener('pointerleave', function(){
    root.style.transform = root._base;
    root.style.filter = '';
  });
  hit.addEventListener('click', function(){
    if (moved > 12) return;         // 見回しただけのときは開かない
    openCard(root._game);
  });
});

/* ---------- 詳細カード ---------- */
var sheet = document.getElementById('sheet'), card = document.getElementById('card');
function openCard(g){
  card.innerHTML = '<div class="kind">'+g.kindLabel+'</div><h2>'+g.title+'</h2><p>'+g.desc+'</p>'+
    '<div class="tags">'+g.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div>'+
    '<div class="acts"><a class="play" href="'+g.url+'">遊ぶ →</a>'+
    '<button class="close">店内に戻る</button></div>';
  sheet.classList.add('on');
  card.querySelector('.close').onclick = function(){ sheet.classList.remove('on'); };
}
window.addEventListener('keydown', function(e){ if (e.key === 'Escape') sheet.classList.remove('on'); });

/* ---------- DOM一覧（情報層 / 3Dが不要な人向け） ---------- */
var rows = document.getElementById('rows');
GAMES.forEach(function(g){
  var r = document.createElement('article');
  r.className = 'row';
  r.innerHTML = '<div class="kind">'+g.kindLabel+'</div><div><h3>'+g.title+'</h3><p>'+g.desc+'</p>'+
    '<div class="tags">'+g.tags.map(function(t){return '<span class="tag">'+t+'</span>';}).join('')+'</div>'+
    '<a class="play" href="'+g.url+'">遊ぶ →</a></div>';
  rows.appendChild(r);
});
var listEl = document.getElementById('list');
document.getElementById('toList').onclick = function(){ listEl.classList.add('on'); };
document.getElementById('toStage').onclick = function(){ listEl.classList.remove('on'); };
</script>
</body>
</html>
