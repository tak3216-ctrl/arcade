<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>VIRTUA RACER</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0d3f6e; font-family: 'Arial Narrow', Arial, sans-serif; }
  canvas { display:block; }

  #hud {
    position:fixed; inset:0; pointer-events:none; color:#fff; z-index:30;
  }

  /* ---- flat arcade panels: hard edges, saturated fills, no glow ---- */
  #speedBox {
    position:absolute; right:20px; bottom:20px; text-align:right;
    background:#12242f; border:3px solid #ffffff; padding:6px 14px 10px;
  }
  #speedVal {
    font-size:56px; font-weight:900; font-style:italic; line-height:1;
    letter-spacing:-2px; color:#ffffff;
  }
  #speedUnit { font-size:14px; font-weight:900; letter-spacing:3px; color:#8fd2ff; }

  #speedBar {
    width:170px; height:10px; background:#0a161e;
    border:2px solid #ffffff; margin-top:8px; margin-left:auto;
  }
  #speedBarFill {
    height:100%; width:0%; background:#e0201c;
  }

  /* LAP panel and the back button sit in one row so the button always lands
     just to the right of the panel, whatever the lap counter reads. */
  #topLeft {
    position:absolute; left:20px; top:18px;
    display:flex; align-items:stretch; gap:10px;
  }
  #lapBox {
    font-size:16px; font-weight:900;
    letter-spacing:3px; background:#12242f; border:3px solid #ffffff;
    padding:5px 14px 7px;
  }
  #backBtn {
    pointer-events:all; display:flex; align-items:center; text-decoration:none;
    font-size:16px; font-weight:900; font-style:italic; letter-spacing:3px;
    color:#ffffff; background:#e0201c; border:3px solid #ffffff;
    padding:0 18px; cursor:pointer; white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  #backBtn:active { background:#a5161f; }
  #lapBox .big { font-size:30px; font-weight:900; font-style:italic; color:#ffd21f; }

  #minimap {
    position:absolute; top:16px; right:16px;
    border:3px solid #ffffff;
    background:#12242f;
  }

  #offroad {
    position:absolute; left:50%; top:16px; transform:translateX(-50%);
    font-size:18px; font-weight:900; font-style:italic; color:#12242f;
    background:#ffd21f; border:3px solid #ffffff; padding:4px 16px;
    opacity:0; transition:opacity 0.12s;
  }

  #title {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:40;
    text-align:center; color:#fff; pointer-events:all;
    background:rgba(10,32,52,0.72); border:4px solid #ffffff;
    padding:34px 56px;
  }
  #title h1 {
    font-size:52px; font-style:italic; font-weight:900; letter-spacing:3px;
    margin:0; color:#ffffff;
  }
  #title h1 span { color:#e0201c; }
  #title p { color:#8fd2ff; margin:8px 0 24px; font-size:13px; letter-spacing:3px; font-weight:700; }

  #courseSel { display:flex; gap:12px; justify-content:center; margin:0; }
  .courseBtn {
    pointer-events:all; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:12px 20px; min-width:190px;
    background:#12242f; border:3px solid #ffffff; color:#8fd2ff;
  }
  .courseBtn b { font-size:19px; font-style:italic; letter-spacing:3px; color:#ffffff; }
  .courseBtn small { font-size:11px; letter-spacing:2px; }
  .courseBtn.on { background:#e0201c; }
  .courseBtn.on small { color:#ffe2e0; }

  #controls {
    position:absolute; top:68px; left:20px;
    font-size:11px; letter-spacing:1px; white-space:nowrap;
    color:#dff1ff; background:rgba(10,32,52,0.55); padding:4px 8px;
  }

  #touch {
    position:fixed; inset:0; pointer-events:none; display:none; z-index:20;
  }
  .tbtn {
    position:absolute; width:78px; height:78px; border-radius:50%;
    background:rgba(224,32,28,0.35); border:3px solid #ffffff;
    color:#fff; font-size:26px; display:flex; align-items:center; justify-content:center;
    pointer-events:all; user-select:none;
  }
  #btnBrake { right:18px; bottom:130px; }
  #btnGas   { right:110px; bottom:130px; }

  /* Portrait on a touch screen only: pedals at double size. Side by side they
     would then reach across into the left-hand steering zone, so they stack. */
  @media (pointer: coarse) and (orientation: portrait) {
    .tbtn { width:156px; height:156px; font-size:52px; border-width:4px; }
    /* raised clear of the speed panel, which occupies the bottom right corner */
    #btnGas   { right:20px; bottom:324px; }
    #btnBrake { right:20px; bottom:150px; }
  }

  /* left half of the screen = floating steering stick zone */
  #stickZone {
    position:absolute; left:0; top:0; width:50%; height:100%;
    pointer-events:none; touch-action:none;   /* enabled once the race starts */
  }
  #stickBase, #stickKnob {
    position:absolute; border-radius:50%; pointer-events:none;
    opacity:0; transition:opacity 0.12s; transform:translate(-50%,-50%);
  }
  #stickBase {
    width:150px; height:150px;
    background:rgba(255,255,255,0.08);
    border:3px solid rgba(255,255,255,0.5);
  }
  #stickKnob {
    width:64px; height:64px;
    background:rgba(224,32,28,0.55);
    border:3px solid #ffffff;
  }
  #stickBase.on, #stickKnob.on { opacity:1; }

  /* Landscape on a touch screen: the speed panel is far too big for a short
     window, so it shrinks to 60% and tucks in beside the minimap. The minimap
     is 150 px wide at right:16, so the panel's right edge sits at 182. */
  @media (pointer: coarse) and (orientation: landscape) {
    #speedBox {
      top:16px; bottom:auto; right:182px;
      transform: scale(0.6); transform-origin: top right;
    }
  }

  #speedlines {
    position:fixed; inset:0; pointer-events:none; opacity:0; z-index:10;
    background: radial-gradient(circle at 50% 46%, transparent 0%, transparent 22%, rgba(255,255,255,0.10) 46%, rgba(255,255,255,0.60) 100%);
    mix-blend-mode: screen;
  }
</style>
</head>
<body>

<div id="hud">
  <div id="topLeft">
    <div id="lapBox">LAP <span class="big" id="lapNum">1</span>/3</div>
    <a id="backBtn" href="https://tak3216-ctrl.github.io/arcade/">&#9664; 戻る</a>
  </div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="offroad">OFF ROAD</div>
  <div id="speedBox">
    <span id="speedVal">0</span><span id="speedUnit"> KM/H</span>
    <div id="speedBar"><div id="speedBarFill"></div></div>
  </div>
  <div id="controls">↑/W 加速　↓/S ブレーキ・後退　←→ / A D ステア　（スマホ：画面左半分をなぞってステア）</div>
</div>

<div id="speedlines"></div>

<div id="title">
  <h1>VIRTUA <span>RACER</span></h1>
  <p id="courseTag">DRIVER'S EYE VIEW</p>
  <div id="courseSel">
    <button class="courseBtn" data-course="1">
      <b>COURSE 1</b><small>GRAND PRIX &mdash; 9.9 km</small>
    </button>
    <button class="courseBtn" data-course="2">
      <b>COURSE 2</b><small>SPIRAL JUNCTION &mdash; 8.8 km</small>
    </button>
  </div>
</div>

<div id="touch">
  <div id="stickZone"></div>
  <div id="stickBase"></div>
  <div id="stickKnob"></div>
  <div class="tbtn" id="btnGas">▲</div>
  <div class="tbtn" id="btnBrake">▼</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

// ---------- course selection ----------
// Both circuits live in this one file. The whole world is built once at load
// from a fixed set of constants, so switching course reloads the page with
// ?course=N rather than trying to tear the scene down and rebuild it.
const COURSE_ID = (new URLSearchParams(location.search).get('course') === '2') ? 2 : 1;
const AUTOSTART = new URLSearchParams(location.search).get('start') === '1';
const COURSE_NAMES = { 1: 'GRAND PRIX', 2: 'SPIRAL JUNCTION' };

// ---------- basic setup ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(82, window.innerWidth/window.innerHeight, 0.1, 13000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
// No tone mapping: the flat-shaded artwork wants its authored colours to come
// through exactly as written, the way a poster or a low-poly render does.
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.0;
// one shadow map from the sun
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// sky gradient (canvas texture) — deep saturated arcade blue, like the reference art
function makeSky(){
  const c = document.createElement('canvas');
  c.width = 8; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,256);
  g.addColorStop(0.00, '#0a5cc6');
  g.addColorStop(0.36, '#1a80de');
  g.addColorStop(0.68, '#55acef');
  g.addColorStop(0.88, '#8ecdf5');
  g.addColorStop(1.00, '#b8e0f8');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,8,256);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.LinearFilter;
  return tex;
}
scene.background = makeSky();
// far haze only: the circuit itself stays crisp and saturated, distant ranges
// fade toward the horizon colour for aerial perspective
scene.fog = new THREE.Fog(0xa9d9f4, 1200, 6500);

// Flat-shaded artwork wants mostly even fill light with just enough sun to
// separate the facets — heavy key lighting would kill the poster-like look.
const hemi = new THREE.HemisphereLight(0xd6ecff, 0x4d7a34, 0.62);
scene.add(hemi);
const ambient = new THREE.AmbientLight(0xffffff, 0.10);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xfff6e6, 0.58);

sun.position.set(-260, 150, 150);   // low sun off to the side = long, readable shadows
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const SHADOW_SPAN = 170;   // shadow camera follows the car, covers its surroundings
sun.shadow.camera.left = -SHADOW_SPAN;
sun.shadow.camera.right = SHADOW_SPAN;
sun.shadow.camera.top = SHADOW_SPAN;
sun.shadow.camera.bottom = -SHADOW_SPAN;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 900;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.06;
sun.shadow.camera.updateProjectionMatrix();   // required after editing the frustum
scene.add(sun);
scene.add(sun.target);

// ---------- terrain height field ----------
// Gentle rolling elevation shared by the road, the curbs, the scenery and the
// car, so everything sits on the same surface. A lake basin is carved out of
// it later, once a suitable spot inside the circuit has been found.
const LAKE = { x:0, z:0, r:0, depth:0, active:false };

// Course 2 is a viaduct, so its ground only has to read as a plausible site
// underneath the structure; course 1 is driven on the terrain itself.
const TERRAIN_AMP = (COURSE_ID === 2) ? 0.45 : 1.0;
function baseHeight(x, z){
  return TERRAIN_AMP * (3.6*Math.sin(x/210) * Math.cos(z/175)
       + 1.7*Math.sin((x + z)/130)
       + 0.8*Math.sin((x - z*0.6)/72));
}
// ---------- course 2 landscape ----------
// Two named features, both driven through by the circuit: a gorge that the
// north-west leg crosses on a high bridge, and a ridge of high ground that the
// transfer between the two spirals runs across.
const SCENERY = (COURSE_ID === 2);
const GORGE = {
  x: -430,          // the gorge runs north-south along this line
  head: 344,        // cliff at its southern head - this is where the falls are
  tail: 1150,
  floorHalf: 50,    // flat river bed
  rimHalf: 100,     // wall crest: 62 m of drop in 50 m, steep enough to read as cliff
  depth: 62
};
const RIDGE = { ax:-200, az:-190, bx:280, bz:180, half:170, peak:48 };
const smoothstep = (t) => { t = Math.max(0, Math.min(1, t)); return t*t*(3-2*t); };

function inGorge(x, z, margin){
  const m = margin || 0;
  return Math.abs(x - GORGE.x) < GORGE.rimHalf + m && z > GORGE.head - m && z < GORGE.tail + m;
}
function gorgeDepth(x, z){
  if (!SCENERY) return 0;
  const u = Math.abs(x - GORGE.x);
  if (u > GORGE.rimHalf) return 0;
  const across = 1 - smoothstep((u - GORGE.floorHalf)/(GORGE.rimHalf - GORGE.floorHalf));
  // abrupt at the head so there is a cliff for the water to fall over, and a
  // gentle run-out at the far end
  const along = smoothstep((z - GORGE.head)/22) * (1 - smoothstep((z - GORGE.tail)/260));
  return GORGE.depth * across * along;
}
function ridgeHeight(x, z){
  if (!SCENERY) return 0;
  // distance to the segment the ridge follows
  const vx = RIDGE.bx-RIDGE.ax, vz = RIDGE.bz-RIDGE.az;
  const t = Math.max(0, Math.min(1, ((x-RIDGE.ax)*vx + (z-RIDGE.az)*vz)/(vx*vx+vz*vz)));
  const px = RIDGE.ax + vx*t, pz = RIDGE.az + vz*t;
  const d = Math.hypot(x-px, z-pz);
  if (d > RIDGE.half) return 0;
  let h = RIDGE.peak * (1 - smoothstep(d/RIDGE.half));
  h *= 0.75 + 0.25*Math.sin(t*9.1) + 0.12*Math.sin(t*23.0);   // an uneven crest
  // the spiral ramps stand on flat ground: hold the ridge well clear of them
  for (const cx of [-340, 340]){
    const dc = Math.hypot(x-cx, z);
    h *= smoothstep((dc - 260)/140);
  }
  return Math.max(0, h);
}

function heightAt(x, z){
  let h = baseHeight(x, z) + ridgeHeight(x, z) - gorgeDepth(x, z);
  if (LAKE.active){
    const d = Math.hypot(x - LAKE.x, z - LAKE.z);
    if (d < LAKE.r){
      const t = 1 - d/LAKE.r;
      h -= LAKE.depth * (t*t*(3 - 2*t));   // smooth bowl
    }
  }
  return h;
}

// ---------- geometry merging (keeps the draw-call count down) ----------
function mergeGeos(geos){
  const flat = geos.map(g => g.index ? g.toNonIndexed() : g);
  let total = 0;
  flat.forEach(g => total += g.attributes.position.count);
  const pos = new Float32Array(total*3);
  const uvs = new Float32Array(total*2);
  let po = 0, uo = 0;
  flat.forEach(g => {
    pos.set(g.attributes.position.array, po);
    if (g.attributes.uv) uvs.set(g.attributes.uv.array, uo);
    po += g.attributes.position.count*3;
    uo += g.attributes.position.count*2;
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('uv', new THREE.BufferAttribute(uvs,2));
  out.computeVertexNormals();
  return out;
}

// ---------- track path ----------
// COURSE 1 - grand prix: a flat circuit that takes its height from the terrain.
// COURSE 2 - spiral junction: two helical ramps, each wound twice, joined by a
// high transfer and a ground level return loop. That circuit passes over itself,
// so it cannot take its height from the terrain the way course 1 does: every
// station carries its own elevation and the road is built as a viaduct on piers.
//
// Course 2 was verified before it was written in: lap 8.77 km, tightest plan
// radius 70.6 m against a 16 m half width, steepest gradient 2.95%, and where
// the decks overlap in plan they are never closer than 21.3 m vertically (a deck
// is 2.4 m thick and carries 9 m of barrier and fencing, so ~12 m is needed).
const ELEVATED    = (COURSE_ID === 2);
const TRACK_SCALE = ELEVATED ? 1 : 6.0;   // course 2 points are already in metres
const HELIX_R     = 190;      // radius of each spiral ramp
const HELIX_CX1   = -340;     // climbing ramp centre
const HELIX_CX2   =  340;     // descending ramp centre
const SUMMIT      = 56;       // height gained over the climb
const TRACK_Y_BASE = 6;       // the ground level lap still runs on a low deck

const gpPoints = () => [
  new THREE.Vector3(0, 0, 0),        // start/finish
  new THREE.Vector3(0, 0, 90),       // straight
  new THREE.Vector3(25, 0, 150),     // Turn 1 entry (right)
  new THREE.Vector3(70, 0, 175),     // Turn 1 apex
  new THREE.Vector3(110, 0, 150),    // Turn 2 (left)
  new THREE.Vector3(100, 0, 100),    // Esses S1
  new THREE.Vector3(140, 0, 80),     // Esses S2
  new THREE.Vector3(130, 0, 30),     // Esses S3
  new THREE.Vector3(170, 0, 10),     // Esses S4
  new THREE.Vector3(200, 0, -30),    // Dunlop-style sweep
  new THREE.Vector3(230, 0, -70),
  new THREE.Vector3(210, 0, -120),   // Degner 1
  new THREE.Vector3(180, 0, -150),   // Degner 2
  new THREE.Vector3(150, 0, -190),   // back straight
  new THREE.Vector3(100, 0, -230),
  new THREE.Vector3(40, 0, -250),
  new THREE.Vector3(-20, 0, -230),   // hairpin apex
  new THREE.Vector3(-70, 0, -190),
  new THREE.Vector3(-110, 0, -140),
  new THREE.Vector3(-150, 0, -90),   // spoon curve entry
  new THREE.Vector3(-190, 0, -30),   // spoon curve mid
  new THREE.Vector3(-200, 0, 30),    // spoon curve exit
  new THREE.Vector3(-170, 0, 90),
  new THREE.Vector3(-120, 0, 140),   // fast sweeper entry (130R-style)
  new THREE.Vector3(-60, 0, 160),    // fast sweeper apex
  new THREE.Vector3(-38, 0, 140),
  new THREE.Vector3(-68, 0, 104),    // chicane left kink
  new THREE.Vector3(-40, 0, 64),     // chicane right kink
  new THREE.Vector3(-34, 0, 14),     // back to the line
  // The chicane used to swing back to x=-10 (-30 m after scaling), which put
  // it only ~24 m from the centreline of the pit straight - closer than the
  // barriers, fencing and tree line stand from the road. The whole run to the
  // line now sits further out, so the neck between the two sections is over
  // 100 m wide and the roadside furniture of one has room next to the other.
].map(p => p.multiplyScalar(TRACK_SCALE));

const controlPts = ELEVATED ? (function buildJunction(){
  const P = [];
  const push = (x, y, z) => P.push(new THREE.Vector3(x, y + TRACK_Y_BASE, z));
  const arc = (cx, cz, r, a0, a1, n, y0, y1) => {
    for (let i=1;i<=n;i++){
      const t = i/n, a = (a0 + (a1-a0)*t) * Math.PI/180;
      push(cx + r*Math.cos(a), y0 + (y1-y0)*t, cz + r*Math.sin(a));
    }
  };
  const STEP = 30;   // degrees between control points on the helices

  // climbing helix, anticlockwise, entered at its south point heading +x
  for (let d=-90; d<630; d+=STEP){
    const a = d*Math.PI/180;
    push(HELIX_CX1 + HELIX_R*Math.cos(a), SUMMIT*(d+90)/720, HELIX_R*Math.sin(a));
  }
  // high transfer: an S from the top of one ramp to the top of the other
  push(-200, SUMMIT,     -190);
  push( -90, SUMMIT-1,   -172);
  push(   0, SUMMIT-2,   -110);
  push(  70, SUMMIT-2.5,  -20);
  push( 140, SUMMIT-3,     80);
  push( 210, SUMMIT-3.5,  150);
  push( 280, SUMMIT-4,    180);
  // descending helix, clockwise, entered at its north point heading +x
  for (let d=90; d>-630; d-=STEP){
    const a = d*Math.PI/180;
    push(HELIX_CX2 + HELIX_R*Math.cos(a), (SUMMIT-4)*(1 - (90-d)/720), HELIX_R*Math.sin(a));
  }
  // ground level return: left loop, back along the north side, left loop again
  arc(HELIX_CX2, 375, 185, -90, 90, 7, 0, 0);
  // The run along the north side weaves instead of running straight, and rides
  // over a crest before dropping into the gorge: the bridge sits at the bottom
  // of the dip and the road climbs away again on the far side. Amplitude and
  // spacing were chosen against the curvature: +-30 m of weave every 170 m of
  // road holds the tightest plan radius at about 100 m, and the steepest part
  // of the dip works out at 3.75%.
  push( 255,  2, 558); push( 150,  5, 528); push( -20,  8, 586);
  push(-190,  6, 524); push(-320,  3, 556);
  push(-430,  0, 560);                      // mid span, the low point of the lap
  push(-520,  2, 558);
  arc(-700, 185, 375,  90, 180, 5,  4, 16); // climbing away from the bridge
  arc(-700, 185, 375, 180, 270, 5, 16,  2);
  push(-620, 1, -190); push(-480, 0, -190);
  return P;
})() : gpPoints();
const curve = new THREE.CatmullRomCurve3(controlPts, true, 'catmullrom', ELEVATED ? 0.5 : 0.6);

const SAMPLES = 400;
// course 2 is a junction ramp, course 1 a wide grand prix circuit
const TRACK_HALF_WIDTH = ELEVATED ? 16 : 37.125;
const trackPts = curve.getSpacedPoints(SAMPLES);
const trackData = []; // {pos, right, dist}
let cumDist = 0;
for (let i=0;i<trackPts.length;i++){
  const p = trackPts[i];
  const pNext = trackPts[(i+1)%trackPts.length];
  const tangent = pNext.clone().sub(p).normalize();
  const right = new THREE.Vector3(tangent.z, 0, -tangent.x).normalize(); // level, across the road
  if (i>0) cumDist += p.distanceTo(trackPts[i-1]);
  trackData.push({ pos:p, tangent, right, dist:cumDist });
}
const TRACK_TOTAL_LEN = cumDist;

// ---------- minimap ----------
const minimapCanvas = document.getElementById('minimap');
const mmCtx = minimapCanvas.getContext('2d');
const MM_SIZE = minimapCanvas.width;
const MM_PAD = 12;
let mmMinX=Infinity, mmMaxX=-Infinity, mmMinZ=Infinity, mmMaxZ=-Infinity;
trackPts.forEach(p=>{
  mmMinX = Math.min(mmMinX, p.x); mmMaxX = Math.max(mmMaxX, p.x);
  mmMinZ = Math.min(mmMinZ, p.z); mmMaxZ = Math.max(mmMaxZ, p.z);
});
const mmSpanX = mmMaxX - mmMinX, mmSpanZ = mmMaxZ - mmMinZ;
const mmScale = (MM_SIZE - MM_PAD*2) / Math.max(mmSpanX, mmSpanZ);
const mmOffX = MM_PAD + (MM_SIZE - MM_PAD*2 - mmSpanX*mmScale)/2;
const mmOffY = MM_PAD + (MM_SIZE - MM_PAD*2 - mmSpanZ*mmScale)/2;
function mmMap(x,z){
  return { x: mmOffX + (x-mmMinX)*mmScale, y: mmOffY + (z-mmMinZ)*mmScale };
}
function drawMinimap(carX, carZ){
  mmCtx.clearRect(0,0,MM_SIZE,MM_SIZE);
  mmCtx.beginPath();
  for (let i=0;i<trackPts.length;i++){
    const m = mmMap(trackPts[i].x, trackPts[i].z);
    if (i===0) mmCtx.moveTo(m.x, m.y); else mmCtx.lineTo(m.x, m.y);
  }
  mmCtx.closePath();

// Denser sampling just for the visual meshes: the 400-point logic ribbon has
// ~10 m segments, whose straight chords could dip below the 8 m terrain grid
// on a crest and let green show through the tarmac.
// 4000 stations keeps the spacing near 2.5 m on the longer circuit. At 2000 the
// stations were 5 m apart, exactly the length of one kerb block, so the red/white
// pattern would have aliased into noise.
const MESH_SAMPLES = 4000;
const meshPts = curve.getSpacedPoints(MESH_SAMPLES);
const meshData = [];
for (let i=0;i<meshPts.length;i++){
  const p = meshPts[i];
  const pNext = meshPts[(i+1)%meshPts.length];
  const tangent = pNext.clone().sub(p).normalize();
  meshData.push({ pos:p, right:new THREE.Vector3(tangent.z, 0, -tangent.x).normalize() });
}

// ---------- how much room each side of the road actually has ----------
// Two different parts of a circuit can run close together. Anything placed at
// a fixed lateral offset from the centreline then lands on the *other* piece of
// road - that is exactly how the trees and the catch fencing ended up standing
// in the middle of the track around the chicane. For every mesh station and
// both sides we work out how far out we can go before coming within CLEAR_NEED
// of a different section, and every roadside object is clamped by that figure.
const meshDist = new Float32Array(MESH_SAMPLES+1);
for (let i=1;i<=MESH_SAMPLES;i++){
  meshDist[i] = meshDist[i-1] + meshPts[i].distanceTo(meshPts[i-1]);
}
const MESH_LEN   = meshDist[MESH_SAMPLES];
const CLEAR_NEED = TRACK_HALF_WIDTH + 6;   // stay this far off the other road's edge
// Barrier and fence lines, declared here because the grandstands, tree line and
// clearance tests all need to sit outside them.
// There is no run-off on a viaduct: on course 2 the barrier is the edge of the
// deck and the fencing stands right behind it.
const WALL_OFF   = TRACK_HALF_WIDTH + (ELEVATED ? 6 : 20);
const WALL_MIN   = TRACK_HALF_WIDTH + (ELEVATED ? 3 : 4.2);
const FENCE_GAP  = ELEVATED ? 1.2 : 16;
const FENCE_OFF  = WALL_OFF + FENCE_GAP;
const ARC_GUARD  = 220;                    // closer than this along the lap = same section
const ROOM_STEP  = 8;                      // stride of the proximity test
const ROOM_CAP   = 400;                    // "plenty of space" ceiling

// tangent recovered from the stored right vector: right = (t.z, -t.x)
function tanAt(i){
  const r = meshData[((i % MESH_SAMPLES) + MESH_SAMPLES) % MESH_SAMPLES].right;
  return { x: -r.z, z: r.x };
}

function computeRoom(sideSign){
  const raw = new Float32Array(MESH_SAMPLES+1);
  const need2 = CLEAR_NEED*CLEAR_NEED;
  const dsCurv = 6*(MESH_LEN/MESH_SAMPLES);
  for (let i=0;i<=MESH_SAMPLES;i++){
    const d = meshData[i % MESH_SAMPLES];
    const dx = d.right.x*sideSign, dz = d.right.z*sideSign;
    let lim = Infinity;
    // Inside of a corner: anything offset further than the radius of curvature
    // folds through the centre of the corner and comes out the far side, which
    // is how an inner barrier can end up crossing its own apex. Cap the offset
    // at a fraction of that radius. The tightest corners here are ~23 m.
    const tA = tanAt(i-3), tB = tanAt(i+3);
    const kr = ((tB.x - tA.x)*dx + (tB.z - tA.z)*dz)/dsCurv;
    // 0.88 rather than 0.82: on the widest road the tightest corner only has
    // ~9 m of radius left inside the kerb, and the barrier needs to use it.
    if (kr > 1e-6) lim = Math.min(lim, 0.88/kr);
    for (let j=0;j<MESH_SAMPLES;j+=ROOM_STEP){
      let arc = Math.abs(meshDist[i] - meshDist[j]);
      if (MESH_LEN - arc < arc) arc = MESH_LEN - arc;
      if (arc < ARC_GUARD) continue;                 // same stretch of road
      // Vertically separated decks pass over one another by design, so they do
      // not constrain each other's barriers at all.
      if (Math.abs(meshData[j].pos.y - d.pos.y) > 12) continue;
      const vx = meshData[j].pos.x - d.pos.x, vz = meshData[j].pos.z - d.pos.z;
      const along = vx*dx + vz*dz;
      if (along <= 0) continue;                      // that section is behind this side
      const px = vx - dx*along, pz = vz - dz*along;
      const perp2 = px*px + pz*pz;
      if (perp2 >= need2) continue;                  // we never pass close to it
      lim = Math.min(lim, along - Math.sqrt(need2 - perp2));
    }
    raw[i] = Math.min(ROOM_CAP, Math.max(0, lim));
  }
  // running minimum, then a light blur: barriers taper in and out of a narrow
  // neck instead of kinking at one station.
  const wrap = (k)=> ((k % MESH_SAMPLES) + MESH_SAMPLES) % MESH_SAMPLES;
  const mn = new Float32Array(MESH_SAMPLES+1);
  for (let i=0;i<=MESH_SAMPLES;i++){
    let v = raw[i];
    for (let k=-10;k<=10;k++) v = Math.min(v, raw[wrap(i+k)]);
    mn[i] = v;
  }
  const out = new Float32Array(MESH_SAMPLES+1);
  for (let i=0;i<=MESH_SAMPLES;i++){
    let sum = 0, n = 0;
    for (let k=-14;k<=14;k++){ sum += mn[wrap(i+k)]; n++; }
    out[i] = sum/n;
  }
  return out;
}
const roomR = computeRoom(1), roomL = computeRoom(-1);
const MESH_PER_SAMPLE = MESH_SAMPLES/SAMPLES;

function roomAt(i, sideSign){
  const arr = sideSign > 0 ? roomR : roomL;
  const idx = Math.round(i);
  return arr[((idx % MESH_SAMPLES) + MESH_SAMPLES) % MESH_SAMPLES];
}
// The offset actually used for a roadside object at mesh station i. minOff is a
// preference, not a guarantee: where the road genuinely has less space than that
// (a tight inside kerb, a narrow neck) the object comes in closer still.
function clampOff(i, sideSign, want, minOff){
  const room  = roomAt(i, sideSign);
  const floor = Math.min(minOff, Math.max(TRACK_HALF_WIDTH + 2.0, room));
  return Math.max(floor, Math.min(want, room));
}
// Height of the road surface at mesh station mi. On a terrain-following circuit
// this is just the ground under that point; on this one every station carries
// its own elevation, so the whole deck - road, kerbs, lines, barriers, fencing,
// posts, gantries - is hung off the curve instead.
function surfY(mi, x, z){
  return ELEVATED ? meshData[((mi % MESH_SAMPLES) + MESH_SAMPLES) % MESH_SAMPLES].pos.y
                  : heightAt(x, z);
}
// Surface the car is actually driving on: the deck on course 2, the terrain on
// course 1. Everything that has to sit on the road - camera, contact shadow,
// shadow map target - goes through this.
function surfaceUnder(frac, x, z){
  return ELEVATED ? deckYAt(frac) : heightAt(x, z);
}
// Height of the deck at a fractional station, used by the car and the camera.
function deckYAt(idx){
  const n = SAMPLES;
  const i0 = ((Math.floor(idx) % n) + n) % n, i1 = (i0+1) % n;
  const f = idx - Math.floor(idx);
  return trackData[i0].pos.y*(1-f) + trackData[i1].pos.y*f;
}

// finer than distToTrack(): walks the 2000-station mesh, so it is accurate to a
// few metres and safe to use as a "is this on the road?" veto for scenery.
function distToTrackFine(x, z){
  let best = Infinity;
  for (let i=0;i<MESH_SAMPLES;i+=4){
    const dx = x - meshData[i].pos.x, dz = z - meshData[i].pos.z;
    const d = dx*dx + dz*dz;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

function buildCurb(sideSign){

// Everything below decides "inside the loop" vs "outside the loop" with a
// point-in-polygon test against the track centreline, then places grandstands
// on the outside and the pit complex / lake / forest on the inside.
const trackPoly = trackPts.map(p => new THREE.Vector2(p.x, p.z));

function insideTrack(x, z){
  let hit = false;
  for (let i=0, j=trackPoly.length-1; i<trackPoly.length; j=i++){
    const a = trackPoly[i], b = trackPoly[j];
    if (((a.y > z) !== (b.y > z)) &&
        (x < (b.x - a.x)*(z - a.y)/(b.y - a.y) + a.x)) hit = !hit;
  }
  return hit;
}
function distToTrack(x, z){
  let best = Infinity;
  for (let i=0;i<trackData.length;i+=2){
    const dx = x - trackData[i].pos.x, dz = z - trackData[i].pos.z;
    const d = dx*dx + dz*dz;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}

}

// crowd is a canvas texture instead of thousands of little boxes
function makeCrowdTexture(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#39424b'; x.fillRect(0,0,512,128);
  const cols = ['#e0201c','#ffd21f','#1f6fd0','#f2f4f6','#18a24c','#d44ea0','#ff8a1a','#7ad0ff'];
  let cs = 12345;
  const r = ()=>{ cs = (cs*1103515245 + 12345) % 2147483648; return cs/2147483648; };
  // chunky blocks of colour rather than tiny figures: reads as a crowd from the
  // car and keeps the flat, poster-like feel of the rest of the scene
  for (let row=0; row<7; row++){
    const y = 6 + row*17;
    x.fillStyle = 'rgba(0,0,0,0.30)';
    x.fillRect(0, y+12, 512, 5);
    for (let i=0;i<34;i++){
      if (r() < 0.10) continue;
      const px = 3 + i*15 + (row%2)*6;
      x.fillStyle = cols[Math.floor(r()*cols.length)];
      x.fillRect(px, y, 10, 12);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  t.repeat.set(3, 1);
  return t;
}

  board.castShadow = true;
  g.add(board);
  return g;
}

const stands = new THREE.Group();
const STAND_LEN = 46;
const STAND_DEPTH = 20;
const STAND_CLEAR = FENCE_OFF + 2;   // must not come inside the catch fencing
// No grandstands or pit complex on this circuit: both are placed by walking
// out sideways from the centreline onto the terrain, which on a viaduct puts
// them in mid-air. The loop is kept but never entered.
for (let i=0;i<SAMPLES && !ELEVATED;i+=30){
  const d = trackData[i];
  const off = FENCE_OFF + 13;
  // pick whichever side is outside the loop
  const cand = [1,-1].map(sgn => d.pos.clone().add(d.right.clone().multiplyScalar(sgn*off)));
  const outIdx = insideTrack(cand[0].x, cand[0].z) ? 1 : 0;
  const p = cand[outIdx];
  if (insideTrack(p.x, p.z)) continue;      // both sides inside: skip

  // The stand is 46 m wide, so at a chicane the ends can swing back over the
  // road even though its centre is clear. Test the whole footprint and skip
  // any placement that would overhang the circuit.
  const toTrack = new THREE.Vector3().subVectors(d.pos, p);
  const yaw = Math.atan2(toTrack.x, toTrack.z) + Math.PI;
  const ax = Math.cos(yaw), az = -Math.sin(yaw);          // along the stand
  const bx = Math.sin(yaw), bz = Math.cos(yaw);           // away from the track
  let ok = true;
  for (let u=-1; u<=1 && ok; u++){
    for (let v=0; v<=2 && ok; v++){
      const fx = p.x + ax*(u*STAND_LEN/2) + bx*(v*STAND_DEPTH/2);
      const fz = p.z + az*(u*STAND_LEN/2) + bz*(v*STAND_DEPTH/2);
      if (insideTrack(fx, fz) || distToTrackFine(fx, fz) < STAND_CLEAR) ok = false;
    }
  }
  if (!ok) continue;

  const st = makeGrandstand(STAND_LEN);
  st.position.set(p.x, heightAt(p.x, p.z) - 0.3, p.z);
  st.rotation.y = yaw;
  stands.add(st);
}
scene.add(stands);

// Skipped here: like the grandstands it is placed by stepping sideways off the
// centreline onto the terrain, and this circuit has no terrain beside it.
const pit = new THREE.Group();
if (!ELEVATED) {
  const d = trackData[6];
  const off = TRACK_HALF_WIDTH + 30;
  const cand = [1,-1].map(sgn => d.pos.clone().add(d.right.clone().multiplyScalar(sgn*off)));
  const inIdx = insideTrack(cand[0].x, cand[0].z) ? 0 : 1;
  const p = cand[inIdx];

  const BAYS = 8, bayW = 8;
  const totalW = BAYS*bayW;
  const wallMat  = new THREE.MeshLambertMaterial({ color: 0xe9edf0 });
  const doorMat  = new THREE.MeshLambertMaterial({ color: 0x2b3138 });
  const trimMat  = new THREE.MeshLambertMaterial({ color: 0xd0202a });

  const building = new THREE.Mesh(new THREE.BoxGeometry(totalW, 9, 14), wallMat);
  building.position.set(0, 4.5, 8);
  pit.add(building);

  for (let b=0;b<BAYS;b++){
    const door = new THREE.Mesh(new THREE.BoxGeometry(bayW*0.72, 5.4, 0.4), doorMat);
    door.position.set(-totalW/2 + bayW/2 + b*bayW, 2.9, 1.0);
    pit.add(door);
    // garage number board
    const plate = new THREE.Mesh(new THREE.BoxGeometry(bayW*0.72, 1.0, 0.3), trimMat);
    plate.position.set(-totalW/2 + bayW/2 + b*bayW, 6.2, 1.0);
    pit.add(plate);
  }
  // upper hospitality deck + roof trim
  const deckPit = new THREE.Mesh(new THREE.BoxGeometry(totalW*1.02, 3.2, 15),
    new THREE.MeshLambertMaterial({ color: 0x9fb3c4, transparent:true, opacity:0.85 }));
  deckPit.position.set(0, 10.6, 8);
  pit.add(deckPit);
  const roofTrim = new THREE.Mesh(new THREE.BoxGeometry(totalW*1.06, 0.7, 16), trimMat);
  roofTrim.position.set(0, 12.5, 8);
  pit.add(roofTrim);

  // pit lane apron + separating wall
  const apron = new THREE.Mesh(new THREE.BoxGeometry(totalW*1.1, 0.2, 9),
    new THREE.MeshLambertMaterial({ color: 0x6d6d6d }));
  apron.position.set(0, 0.1, -3.4);
  pit.add(apron);
  const pitWall = new THREE.Mesh(new THREE.BoxGeometry(totalW*1.1, 1.2, 0.5),
    new THREE.MeshLambertMaterial({ color: 0xe6e6e6 }));
  pitWall.position.set(0, 0.6, -5);
  pit.add(pitWall);

  // timing tower next to the garages
  const tower = new THREE.Mesh(new THREE.BoxGeometry(7, 22, 7), wallMat);
  tower.position.set(-totalW/2 - 8, 11, 8);
  pit.add(tower);
  const towerScreen = new THREE.Mesh(new THREE.BoxGeometry(5.4, 8, 0.4),
    new THREE.MeshBasicMaterial({ color: 0x0d1114 }));
  towerScreen.position.set(-totalW/2 - 8, 14, 4.4);
  pit.add(towerScreen);

  pit.position.set(p.x, heightAt(p.x, p.z) - 0.3, p.z);
  const toTrackP = new THREE.Vector3().subVectors(d.pos, p);
  pit.rotation.y = Math.atan2(toTrackP.x, toTrackP.z) + Math.PI;
}
pit.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
scene.add(pit);

// --- forest filling the rest of the infield ---
// Trees near the circuit stay as individual trunk+canopy models. Everything
// further in is merged, per grid cell, into a single blobby canopy mesh with
// no trunks — visually a mass of foliage, but only one draw call per cell.
const forest = new THREE.Group();
const foliageMats = [
  new THREE.MeshLambertMaterial({ color: 0x2e7d32 }),
  new THREE.MeshLambertMaterial({ color: 0x246b2a }),
  new THREE.MeshLambertMaterial({ color: 0x3d8f3a }),
];
const blobMat = new THREE.MeshLambertMaterial({ color: 0x2b7a2f });
const pineGeo = new THREE.ConeGeometry(3.2, 9, 7);
const broadGeo = new THREE.SphereGeometry(3.6, 7, 6);
const bigTrunkGeo = new THREE.CylinderGeometry(0.55, 0.75, 5, 6);
const blobUnitGeo = new THREE.IcosahedronGeometry(1, 0);   // 20 tris per lump
const NEAR_TREE_DIST = 66;   // detailed models within this distance of the road
const CELL = 150;            // merge cell size for the far canopy
let seed = 20260813;
function rnd(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }

const blobCells = new Map();

for (let x=bounds.minX; x<=bounds.maxX; x+=30){
  for (let z=bounds.minZ; z<=bounds.maxZ; z+=30){
    const jx = x + (rnd()-0.5)*12, jz = z + (rnd()-0.5)*12;
    if (!insideTrack(jx, jz)) continue;
    const dTrack = distToTrackFine(jx, jz);
    if (dTrack < 40) continue;                                    // keep run-off + barriers clear
    if (Math.hypot(jx-LAKE.x, jz-LAKE.z) < LAKE.r*1.25) continue; // keep the lake clear
    if (pit.position.distanceTo(new THREE.Vector3(jx, pit.position.y, jz)) < 70) continue;
    if (rnd() > 0.55) continue;

    const y = heightAt(jx, jz) - 0.3;

    if (dTrack < NEAR_TREE_DIST){
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(bigTrunkGeo, treeTrunkMat);
      trunk.position.y = 2.5; trunk.castShadow = true;
      g.add(trunk);
      const isPine = rnd() < 0.72;
      const top = new THREE.Mesh(isPine ? pineGeo : broadGeo,
        foliageMats[Math.floor(rnd()*foliageMats.length)]);
      top.position.y = isPine ? 8.5 : 7.2;
      top.castShadow = true;
      g.add(top);
      g.scale.setScalar(0.7 + rnd()*0.7);
      g.position.set(jx, y, jz);
      forest.add(g);
    } else {
      // far tree -> a few overlapping lumps queued into this cell's blob
      const key = Math.floor(jx/CELL)+'_'+Math.floor(jz/CELL);
      if (!blobCells.has(key)) blobCells.set(key, []);
      const lumps = blobCells.get(key);
      const lumpN = 2 + Math.floor(rnd()*2);
      for (let l=0; l<lumpN; l++){
        const r = 3.4 + rnd()*2.6;
        const m = new THREE.Matrix4();
        m.compose(
          new THREE.Vector3(jx + (rnd()-0.5)*6, y + 4.5 + rnd()*3.5, jz + (rnd()-0.5)*6),
          new THREE.Quaternion().setFromEuler(new THREE.Euler(rnd()*3, rnd()*3, rnd()*3)),
          new THREE.Vector3(r, r*(0.7+rnd()*0.5), r)
        );
        const gg = blobUnitGeo.clone();
        gg.applyMatrix4(m);
        lumps.push(gg);
      }
    }
  }
}
blobCells.forEach(lumps => {
  if (!lumps.length) return;
  const mesh = new THREE.Mesh(mergeGeos(lumps), blobMat);
  mesh.castShadow = true;
  forest.add(mesh);
  lumps.forEach(g => g.dispose());
});
scene.add(forest);

// ============================================================================
//  LOW-POLY SCENERY LAYER
//  Everything below exists purely for the look: faceted ranges on the horizon,
//  angular clouds, concrete barriers with hoardings, catch fencing, start
//  gantries and painted track markings.
// ============================================================================

function lpMat(hex, extra){
  return new THREE.MeshLambertMaterial(Object.assign({ color:hex }, extra||{}));
}

// ---------- faceted mountain ranges on the horizon ----------
(function buildMountains(){
  const rings = [
    // radii pushed out with the circuit: the site is now ~1300 m from centre to
    // the far side of the track, so the first ring would have sat on the road.
    { n:34, r0:2000, r1:2600, h0:150, h1:310, w0:200, w1:360, col:0x3d7a5c },
    { n:28, r0:2750, r1:3550, h0:220, h1:430, w0:280, w1:500, col:0x559073 },
    { n:24, r0:3650, r1:4600, h0:260, h1:520, w0:360, w1:640, col:0x82b0a2 },
  ];
  rings.forEach(ring=>{
    const geos = [];
    for (let i=0;i<ring.n;i++){
      const ang = (i/ring.n)*Math.PI*2 + (rnd()-0.5)*0.16;
      const rad = ring.r0 + rnd()*(ring.r1-ring.r0);
      const h   = ring.h0 + rnd()*(ring.h1-ring.h0);
      const w   = ring.w0 + rnd()*(ring.w1-ring.w0);
      const g = new THREE.ConeGeometry(w*0.5, h, 4 + Math.floor(rnd()*3), 1);
      const m = new THREE.Matrix4().compose(
        new THREE.Vector3(midX + Math.cos(ang)*rad, h*0.5 - 70, midZ + Math.sin(ang)*rad),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rnd()*Math.PI*2, 0)),
        new THREE.Vector3(1, 1, 0.75 + rnd()*0.5)
      );
      g.applyMatrix4(m);
      geos.push(g);
    }
    const mesh = new THREE.Mesh(mergeGeos(geos), lpMat(ring.col));
    scene.add(mesh);
    geos.forEach(g=>g.dispose());
  });
})();

// ---------- angular clouds ----------
(function buildClouds(){
  const geos = [];
  for (let i=0;i<40;i++){
    const ang = rnd()*Math.PI*2;
    const rad = 220 + rnd()*1900;
    const bx = midX + Math.cos(ang)*rad;
    const bz = midZ + Math.sin(ang)*rad;
    const by = 190 + rnd()*230;
    const s  = 0.75 + rnd()*1.35;
    const lumps = 3 + Math.floor(rnd()*3);
    for (let l=0;l<lumps;l++){
      const r = (13 + rnd()*15)*s;
      const g = new THREE.IcosahedronGeometry(1, 0);
      const m = new THREE.Matrix4().compose(
        new THREE.Vector3(bx + (l - (lumps-1)/2)*r*1.25 + (rnd()-0.5)*r*0.4,
                          by + (rnd()-0.35)*r*0.55,
                          bz + (rnd()-0.5)*r*0.7),
        new THREE.Quaternion().setFromEuler(new THREE.Euler(rnd()*3, rnd()*3, rnd()*3)),
        new THREE.Vector3(r, r*0.62, r*0.85)
      );
      g.applyMatrix4(m);
      geos.push(g);
    }
  }
  const cloudMat = new THREE.MeshPhongMaterial({
    color:0xffffff, emissive:0x7a8fa0, flatShading:true, shininess:0, fog:false });
  cloudMat.specular.setRGB(0,0,0);
  const mesh = new THREE.Mesh(mergeGeos(geos), cloudMat);
  scene.add(mesh);
  geos.forEach(g=>g.dispose());
})();

// ---------- generic ribbons that follow the circuit ----------
// A vertical ribbon (barriers, fencing) and a flat ribbon (painted lines) both
// walk the dense mesh sampling so they hug the terrain exactly like the road.
const RIB_STEP = 4;
const RIB_COUNT = Math.floor(MESH_SAMPLES/RIB_STEP);

// `off` may be a number or a function of the mesh station index, which is how
// the barriers and fencing pull in where the circuit runs back on itself.
function offVal(off, i){ return (typeof off === 'function') ? off(i) : off; }

function buildVertRibbon(sideSign, off, yLo, yHi, colorFn, mat, withUV, uvRepeat){
  const pos=[], col=[], uv=[], idx=[];
  for (let k=0;k<=RIB_COUNT;k++){
    const mi = (k*RIB_STEP) % MESH_SAMPLES;
    const d = meshData[mi];
    const b = d.pos.clone().add(d.right.clone().multiplyScalar(sideSign*offVal(off, mi)));
    const base = surfY(mi, b.x, b.z);
    const c = colorFn(k);
    // yLo/yHi may also be functions of the station, which is how the catch
    // fencing is dropped to nothing across the gorge bridge
    pos.push(b.x, base+offVal(yLo, mi), b.z); col.push(c.r,c.g,c.b);
    pos.push(b.x, base+offVal(yHi, mi), b.z); col.push(c.r,c.g,c.b);
    if (withUV){ const u = k*uvRepeat; uv.push(u,0, u,1); }
  }
  for (let k=0;k<RIB_COUNT;k++){
    const a=k*2, b=k*2+1, c=k*2+2, d=k*2+3;
    idx.push(a,b,c, b,d,c);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  if (withUV) g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

function buildFlatRibbon(offInner, offOuter, yOff, colorFn, mat){
  const pos=[], col=[], idx=[];
  for (let k=0;k<=RIB_COUNT;k++){
    const mi = (k*RIB_STEP) % MESH_SAMPLES;
    const d = meshData[mi];
    const a = d.pos.clone().add(d.right.clone().multiplyScalar(offVal(offInner, mi)));
    const b = d.pos.clone().add(d.right.clone().multiplyScalar(offVal(offOuter, mi)));
    const c = colorFn(k);
    const base = surfY(mi, d.pos.x, d.pos.z);
    pos.push(a.x, base+yOff, a.z); col.push(c.r,c.g,c.b);
    pos.push(b.x, base+yOff, b.z); col.push(c.r,c.g,c.b);
  }
  for (let k=0;k<RIB_COUNT;k++){
    const a=k*2, b=k*2+1, c=k*2+2, d=k*2+3;
    idx.push(a,b,c, b,d,c);
  }
  const g = new THREE.BufferGeometry();
  g.setIndex(idx);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

// ---------- painted white edge lines just inside the kerbs ----------
const lineMat = new THREE.MeshLambertMaterial({ vertexColors:true, side:THREE.DoubleSide });
const WHITE = new THREE.Color(0xf2f4f6);
[1,-1].forEach(s=>{
  buildFlatRibbon(s*(TRACK_HALF_WIDTH-0.60), s*(TRACK_HALF_WIDTH-0.10), 0.30, ()=>WHITE, lineMat);
});

// ---------- concrete barriers with advertising hoardings ----------
const WALL_H     = 1.75;
const CONCRETE_A = new THREE.Color(0xc2c7cc);
const CONCRETE_B = new THREE.Color(0xacb2b8);
const AD_COLS = [ new THREE.Color(0x18a24c), new THREE.Color(0x1f6fd0),
                  new THREE.Color(0xd0202a), new THREE.Color(0xf0c020) ];
const wallMatVC = new THREE.MeshLambertMaterial({ vertexColors:true, side:THREE.DoubleSide });

function wallColor(k){
  const panel = Math.floor(meshDist[(k*RIB_STEP) % MESH_SAMPLES]/20);   // 20 m boards
  if (panel % 3 === 0) return AD_COLS[panel % AD_COLS.length];
  return (panel % 2 === 0) ? CONCRETE_A : CONCRETE_B;
}
// The barrier line hugs the road wherever there is not enough room for the full
// 21.6 m run-off - between the chicane and the pit straight, for instance.
const wallOffAt = (s) => (i) => clampOff(i, s, WALL_OFF, WALL_MIN);
[1,-1].forEach(s=>{
  buildVertRibbon(s, wallOffAt(s), 0.05, WALL_H, wallColor, wallMatVC);
  buildVertRibbon(s, wallOffAt(s), WALL_H, WALL_H+0.32, ()=>WHITE, wallMatVC);  // white cap rail
});

// ---------- catch fencing above the barriers ----------
const fenceTex = (function(){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d');
  x.clearRect(0,0,64,64);
  x.strokeStyle = 'rgba(226,236,242,0.95)'; x.lineWidth = 3.5;
  for (let i=-64;i<128;i+=16){
    x.beginPath(); x.moveTo(i,0);  x.lineTo(i+64,64); x.stroke();
    x.beginPath(); x.moveTo(i,64); x.lineTo(i+64,0);  x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();
const fenceMat = new THREE.MeshLambertMaterial({
  map: fenceTex, vertexColors:true, side:THREE.DoubleSide,
  transparent:false, alphaTest:0.35, depthWrite:true
});
// uvRepeat is tuned so the lattice cells come out roughly square (~1.8 m): the
// old 0.55 stretched them to 4.5 m wide, which read as a giant white grid and
// gave the eye almost nothing to measure speed against.
const FENCE_UV = (RIB_STEP*(MESH_LEN/MESH_SAMPLES))/7.2;
// the fencing now stands well back from the barrier instead of right on top of
// it, so it stops crowding the edge of the frame
const fenceOffAt = (s) => (i) => clampOff(i, s, FENCE_OFF, WALL_MIN + FENCE_GAP);
// Course 2 carries no catch fencing anywhere: it is a viaduct with a solid
// barrier at the edge of the deck, and the fencing was walling the driver in on
// a circuit whose whole point is the view out over the valley and the ramps.
if (!ELEVATED) [1,-1].forEach(s=>{
  buildVertRibbon(s, fenceOffAt(s), WALL_H + 0.30, WALL_H + 7.2,
                  ()=>WHITE, fenceMat, true, FENCE_UV);
});

// fence posts, merged into one mesh per side
const postMat = lpMat(0x59636b);
if (!ELEVATED) [1,-1].forEach(s=>{
  const geos = [];
  // one post every ~20 m instead of every ~140 m: the posts flicking past are
  // one of the strongest speed cues in the frame.
  for (let k=0;k<RIB_COUNT;k+=2){   // ~20 m spacing at the current mesh density
    const mi = (k*RIB_STEP) % MESH_SAMPLES;
    const d = meshData[mi];
    const b = d.pos.clone().add(d.right.clone().multiplyScalar(s*fenceOffAt(s)(mi)));
    const base = surfY(mi, b.x, b.z);
    const g = new THREE.BoxGeometry(0.34, 7.6, 0.34);
    g.translate(b.x, base + WALL_H + 3.6, b.z);
    geos.push(g);
  }
  if (geos.length){
    const mesh = new THREE.Mesh(mergeGeos(geos), postMat);
    mesh.castShadow = true;
    scene.add(mesh);
    geos.forEach(g=>g.dispose());
  }
});

// ---------- viaduct: the structure the whole circuit is carried on ----------
// The road here is not laid on the ground, so it needs an underside, side skirts
// and piers. Piers are placed only where they would not come down through a
// lower deck: at the two spirals the turns sit directly on top of one another,
// so those piers step out sideways and reach back in on a cantilevered head.
(function viaduct(){
  if (!ELEVATED) return;
  const DECK = 2.4;                       // structural depth below the road
  const deckCol  = new THREE.Color(0x8d949b);
  const skirtCol = new THREE.Color(0x767d84);
  const deckMat = new THREE.MeshLambertMaterial({ vertexColors:true, side:THREE.DoubleSide });
  const edgeAt = (sgn) => (i) => clampOff(i, sgn, WALL_OFF, WALL_MIN) + 0.6;

  // soffit and the two side faces
  buildFlatRibbon((i)=>-edgeAt(-1)(i), (i)=>edgeAt(1)(i), -DECK, ()=>deckCol, deckMat);
  [1,-1].forEach(sg=>{
    buildVertRibbon(sg, edgeAt(sg), -DECK, 0.06, ()=>skirtCol, deckMat);
  });

  // does a pier dropped at (x,z) from height topY pass through another deck?
  function pierBlocked(x, z, topY){
    for (let j=0;j<MESH_SAMPLES;j+=6){
      const q = meshData[j];
      if (q.pos.y > topY - 4) continue;                 // at or above us: not in the way
      const dx = x - q.pos.x, dz = z - q.pos.z;
      if (dx*dx + dz*dz < (WALL_OFF + 5)*(WALL_OFF + 5)) return true;
    }
    return false;
  }

  const geos = [];
  const scratch = new THREE.Object3D();
  for (let k=0;k<RIB_COUNT;k+=6){                        // a pier about every 50 m
    const mi = (k*RIB_STEP) % MESH_SAMPLES;
    const d  = meshData[mi];
    const topY = d.pos.y - DECK;
    // straight down first, then stepped out to either side
    let lateral = null;
    for (const off of [0, WALL_OFF + 9, -(WALL_OFF + 9)]){
      const px = d.pos.x + d.right.x*off, pz = d.pos.z + d.right.z*off;
      if (!pierBlocked(px, pz, topY)){ lateral = off; break; }
    }
    if (lateral === null) continue;                      // nowhere clear: skip this bay
    const px = d.pos.x + d.right.x*lateral, pz = d.pos.z + d.right.z*lateral;
    const ground = heightAt(px, pz) - 0.6;
    const h = topY - ground;
    if (h < 2.5) continue;                               // practically on the ground
    if (h > 46) continue;                                // over the river: let it span

    const col = new THREE.CylinderGeometry(2.2, 3.1, h, 8);
    col.translate(px, ground + h/2, pz);
    geos.push(col);

    // pier head: reaches from the column back under the centre of the deck
    const reach = Math.abs(lateral) + 6;
    const cap = new THREE.BoxGeometry(reach, 1.5, 6.5);
    scratch.position.set((d.pos.x + px)/2, topY - 0.75, (d.pos.z + pz)/2);
    scratch.rotation.set(0, Math.atan2(d.right.x, d.right.z), 0);
    scratch.updateMatrix();
    cap.applyMatrix4(scratch.matrix);
    geos.push(cap);
  }
  if (geos.length){
    const piers = new THREE.Mesh(mergeGeos(geos),
      new THREE.MeshLambertMaterial({ color: 0x9aa1a8 }));
    piers.castShadow = true; piers.receiveShadow = true;
    scene.add(piers);

(function gorgeScenery(){
  if (!SCENERY) return;
  const grp = new THREE.Group();
  const waterMat = new THREE.MeshLambertMaterial({ color:0x2f6f9e });
  const foamMat  = new THREE.MeshLambertMaterial({ color:0xdff0fb });
  const rockMat  = new THREE.MeshLambertMaterial({ color:0x6f736d });
  const peakMat  = new THREE.MeshLambertMaterial({ color:0x4f7a5d });
  const capMat   = new THREE.MeshLambertMaterial({ color:0xe8eef2 });

  // --- river along the floor, following the bed rather than a flat plane ---
  const pos=[], idx=[];
  const zStart = GORGE.head + 12, zEnd = GORGE.tail - 120, ST = 24;
  let row = 0;
  for (let z=zStart; z<=zEnd; z+=ST, row++){
    for (const sgn of [-1, 1]){
      const x = GORGE.x + sgn*GORGE.floorHalf*0.78;
      pos.push(x, heightAt(x, z) + 0.5, z);
    }
    if (row > 0){
      const a0=(row-1)*2, b0=a0+1, c0=row*2, d0=c0+1;
      idx.push(a0,b0,c0, b0,d0,c0);
    }
  }
  const rg = new THREE.BufferGeometry();
  rg.setIndex(idx);
  rg.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  rg.computeVertexNormals();
  const river = new THREE.Mesh(rg, waterMat);
  river.receiveShadow = true;
  grp.add(river);

  // --- the falls, dropping over the cliff at the head of the gorge ---
  const rimY   = heightAt(GORGE.x, GORGE.head - 45);
  const floorY = heightAt(GORGE.x, GORGE.head + 60) + 0.5;
  const fallH  = rimY - floorY;
  const fallZ  = GORGE.head + 7;
  [[16, 0], [7, -13], [5, 12]].forEach(([w, dx], i)=>{
    const fall = new THREE.Mesh(new THREE.BoxGeometry(w, fallH*(i?0.86:1), 1.6),
                                i ? foamMat : waterMat);
    fall.position.set(GORGE.x + dx, floorY + fallH*(i?0.43:0.5) + (i?fallH*0.07:0), fallZ + i*1.2);
    grp.add(fall);
  });
  // lip at the crest and the plunge pool below
  const lip = new THREE.Mesh(new THREE.BoxGeometry(30, 1.2, 7), waterMat);
  lip.position.set(GORGE.x, rimY + 0.2, GORGE.head - 2);
  grp.add(lip);
  const pool = new THREE.Mesh(new THREE.CylinderGeometry(34, 30, 1.2, 14), waterMat);
  pool.position.set(GORGE.x, floorY + 0.2, fallZ + 26);
  grp.add(pool);
  const foam = new THREE.Mesh(new THREE.CylinderGeometry(15, 11, 1.6, 12), foamMat);
  foam.position.set(GORGE.x, floorY + 0.7, fallZ + 12);
  grp.add(foam);
  // spray, as a few chunky blocks at the base
  for (let i=0;i<7;i++){
    const sc = 3 + (i%3)*2.4;
    const b = new THREE.Mesh(new THREE.BoxGeometry(sc*2, sc, sc*1.6), foamMat);
    b.position.set(GORGE.x + Math.sin(i*2.3)*16, floorY + 2 + (i%4)*3.4, fallZ + 6 + (i%3)*7);
    grp.add(b);
  }
  // boulders scattered along the bed
  for (let i=0;i<26;i++){
    const z = zStart + 40 + i*((zEnd-zStart-60)/26);
    const x = GORGE.x + Math.sin(i*1.7)*GORGE.floorHalf*0.8;
    const r = 2.6 + (i%4)*1.5;
    const b = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), rockMat);
    b.position.set(x, heightAt(x, z) + r*0.35, z);
    b.rotation.set(i*0.7, i*1.1, i*0.4);
    b.castShadow = true;
    grp.add(b);
  }

  // --- peaks standing on the ridge the transfer crosses ---
  for (let i=0;i<14;i++){
    const t = (i+0.5)/14;
    const bx = RIDGE.ax + (RIDGE.bx-RIDGE.ax)*t;
    const bz = RIDGE.az + (RIDGE.bz-RIDGE.az)*t;
    const side = (i%2 ? 1 : -1) * (70 + (i%3)*46);
    const nx = -(RIDGE.bz-RIDGE.az), nz = (RIDGE.bx-RIDGE.ax);
    const nl = Math.hypot(nx, nz);
    const px = bx + nx/nl*side, pz = bz + nz/nl*side;
    if (distToTrackFine(px, pz) < 110) continue;    // keep the road corridor clear
    const h = 34 + (i%4)*16;
    const peak = new THREE.Mesh(new THREE.ConeGeometry(h*0.62, h, 5), peakMat);
    peak.position.set(px, heightAt(px, pz) + h/2 - 2, pz);
    peak.rotation.y = i*0.6;
    peak.castShadow = true;
    grp.add(peak);
    if (h > 55){
      const cap = new THREE.Mesh(new THREE.ConeGeometry(h*0.62*0.32, h*0.3, 5), capMat);
      cap.position.set(px, heightAt(px, pz) + h - 2 - h*0.15, pz);
      cap.rotation.y = i*0.6;
      grp.add(cap);
    }
  }
  scene.add(grp);
})();

// ---------- dense conifer line behind the fencing ----------
(function treeLine(){
  if (ELEVATED) return;   // nothing to plant on: the fencing is on a deck
  const coneGeo = new THREE.ConeGeometry(3.6, 11, 6);
  const trunkG  = new THREE.CylinderGeometry(0.5, 0.7, 3.2, 5);
  const cols = [0x2c6b38, 0x24592f, 0x367b3c];
  const buckets = [[],[],[]];
  const trunks = [];
  for (let k=0;k<RIB_COUNT;k+=3){
    const d = meshData[(k*RIB_STEP) % MESH_SAMPLES];
    [1,-1].forEach(s=>{
      const rows = 2 + Math.floor(rnd()*2);
      const mi = (k*RIB_STEP) % MESH_SAMPLES;
      const fenceHere = fenceOffAt(s)(mi);
      for (let r=0;r<rows;r++){
        const off = fenceHere + 8 + r*9 + rnd()*6;
        const p = d.pos.clone().add(d.right.clone().multiplyScalar(s*off));
        if (rnd() > 0.55) continue;
        // final veto: a tree row aimed outwards from one corner can still reach
        // another part of the circuit, so anything that lands near tarmac goes.
        if (distToTrackFine(p.x, p.z) < TRACK_HALF_WIDTH + 16) continue;
        if (Math.hypot(p.x - pit.position.x, p.z - pit.position.z) < 80) continue;
        let blocked = false;
        for (let q=0;q<stands.children.length;q++){
          const sp = stands.children[q].position;
          if (Math.hypot(p.x - sp.x, p.z - sp.z) < 38){ blocked = true; break; }
        }
        if (blocked) continue;
        const y = heightAt(p.x, p.z) - 0.3;
        const sc = 0.75 + rnd()*0.7;
        const ci = Math.floor(rnd()*3);
        const g = coneGeo.clone();
        g.applyMatrix4(new THREE.Matrix4().compose(
          new THREE.Vector3(p.x, y + 5.5*sc + 2.4*sc, p.z),
          new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rnd()*3, 0)),
          new THREE.Vector3(sc, sc, sc)));
        buckets[ci].push(g);
        const t = trunkG.clone();
        t.applyMatrix4(new THREE.Matrix4().makeTranslation(p.x, y + 1.6*sc, p.z));
        trunks.push(t);
      }
    });
  }
  buckets.forEach((b,i)=>{
    if (!b.length) return;
    const m = new THREE.Mesh(mergeGeos(b), lpMat(cols[i]));
    m.castShadow = true; scene.add(m);
    b.forEach(g=>g.dispose());
  });
  if (trunks.length){
    scene.add(new THREE.Mesh(mergeGeos(trunks), lpMat(0x6b4a2c)));
    trunks.forEach(g=>g.dispose());
  }
  coneGeo.dispose(); trunkG.dispose();
})();

function makeFrontWheel(sign){
  const g = new THREE.Group();          // steering (yaw) pivot
  const spin = new THREE.Group();       // rolling pivot: rotates about the X axle
  g.add(spin);

  const t = new THREE.Mesh(tireGeo, tireMat);
  t.rotation.z = Math.PI/2;             // lay the cylinder on its side, axle along X
  spin.add(t);

    const sh = new THREE.Mesh(shoulderGeo, shoulderMat);
    sh.rotation.z = Math.PI/2;
    sh.position.x = sd * TIRE_W*0.35;
    spin.add(sh);
  });

  const r = new THREE.Mesh(rimGeo, rimMat);
  r.rotation.y = Math.PI/2;
  r.position.x = sign * -0.105;
  spin.add(r);

  // spokes only - no tread blocks on a slick. They still show the wheel turning.

    sp.rotation.x = (i/5)*Math.PI;
    sp.position.x = sign * -0.105;

  }

  g.position.set(sign*1.08, -0.78, -1.6);

}
