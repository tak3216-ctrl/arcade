carFront.traverse(o=>{ if (o.isMesh) o.castShadow = true; });





// ---------- colour space pass ----------
// The renderer outputs sRGB, so every colour authored as an sRGB hex (and the
// vertex colours on the road/curbs) has to be converted to linear first,
// otherwise the whole scene comes out washed out.
(function convertColorSpace(){
  const done = new Set();
  scene.traverse(o=>{
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(m=>{
      if (!m || done.has(m.uuid)) return;
      done.add(m.uuid);
      if (m.color) m.color.convertSRGBToLinear();
      if (m.map) m.map.encoding = THREE.sRGBEncoding;
    });
    const ca = o.geometry && o.geometry.attributes && o.geometry.attributes.color;
    if (ca && !done.has(o.geometry.uuid)){
      done.add(o.geometry.uuid);
      const c = new THREE.Color();
      for (let i=0;i<ca.count;i++){
        c.setRGB(ca.getX(i), ca.getY(i), ca.getZ(i)).convertSRGBToLinear();
        ca.setXYZ(i, c.r, c.g, c.b);
      }
      ca.needsUpdate = true;
    }
  });
  if (scene.background && scene.background.isTexture) scene.background.encoding = THREE.sRGBEncoding;
  if (scene.fog) scene.fog.color.convertSRGBToLinear();
  hemi.color.convertSRGBToLinear();
  hemi.groundColor.convertSRGBToLinear();
  sun.color.convertSRGBToLinear();
})();

// ---------- flat shading pass ----------
// MeshLambertMaterial lights per vertex, so it cannot do faceted shading at all.
// Every solid surface is swapped for a Phong material with flatShading and no
// specular: same matte look, but each triangle now reads as its own facet, which
// is what gives the whole scene its low-poly, hand-painted feel.
// The ribbons that follow the circuit (tarmac, kerbs, painted lines, barriers)
// keep smooth shading — they are long thin strips and would shade as a zig-zag.
(function flatShadeEverything(){
  const swap = new Map();
  scene.traverse(o=>{
    if (!o.isMesh || !o.material) return;
    const convert = (m)=>{
      if (!m || !m.isMeshLambertMaterial || m.vertexColors) return m;
      if (m.userData && m.userData.keepSmooth) return m;   // slick tyres stay smooth
      if (swap.has(m.uuid)) return swap.get(m.uuid);
      const p = new THREE.MeshPhongMaterial({
        color: m.color,
        map: m.map || null,
        side: m.side,
        transparent: m.transparent,
        opacity: m.opacity,
        alphaTest: m.alphaTest,
        depthWrite: m.depthWrite,
        fog: m.fog,
        flatShading: true,
        shininess: 0,
      });
      p.specular.setRGB(0,0,0);
      swap.set(m.uuid, p);
      return p;
    };
    o.material = Array.isArray(o.material) ? o.material.map(convert) : convert(o.material);
  });
})();

// ---------- contact shadow under the car ----------
// The shadow map handles the scenery; this soft blob keeps the car itself
// visibly planted on the road even on hardware where shadow maps are disabled.
const blobShadowTex = (function(){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(64,64,4, 64,64,62);
  g.addColorStop(0, 'rgba(0,0,0,0.62)');
  g.addColorStop(0.55, 'rgba(0,0,0,0.34)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
})();
const carShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(6.4, 9.2),
  new THREE.MeshBasicMaterial({ map: blobShadowTex, transparent:true, depthWrite:false })
);
carShadow.rotation.x = -Math.PI/2;
carShadow.renderOrder = 2;
scene.add(carShadow);

function fmtLapTime(t){
  const m = Math.floor(t/60);
  const s = t - m*60;
  return m + ':' + (s<10?'0':'') + s.toFixed(3);
}

// ---------- car (invisible body, POV camera) ----------
const car = {
  pos: trackData[0].pos.clone(),
  heading: Math.atan2(trackData[0].tangent.x, trackData[0].tangent.z),
  speed: 0,          // m/s (signed, negative = reverse)
  steerAngle: 0,      // current visual steer for camera lean
};

// Course 2 runs to 350 km/h: it is a wide open viaduct with long ramps, where
// course 1 tops out at 300. The tapering curves below are written against
// MAX_KMH rather than a hard 300 so they stretch with it.
const MAX_KMH   = ELEVATED ? 350 : 300;
const MAX_SPEED = MAX_KMH/3.6;
const ACCEL = 30;
const BRAKE = 39;      // 70% of the old 56 — softer braking
const REVERSE_MAX = 12;
const ENGINE_DRAG = 6;      // natural decel when no input
const TURN_RATE_MAX = 2.0;  // rad/s at speed
const OFFROAD_DRAG_MULT = 2.4;
const OFFROAD_MAXSPEED_MULT = 0.5; // off-track = half normal speed
const OFFROAD_DECEL = ACCEL*0.3;   // losing speed off-track takes time, no instant clamp

// --- off-track test based on the car's actual footprint ---
// The old test compared the centreline offset against the road edge, so the car
// was already half off the track before "OFF ROAD" appeared. These figures come
// straight from the wheel placement, so they stay right if the car changes.
const OFFROAD_BITE = 0.20;                                // trips at 20% of the tread out
const OFFROAD_EDGE = TRACK_HALF_WIDTH - (TYRE_OUTER - TYRE_WIDTH*OFFROAD_BITE);

// ---------- input ----------
const input = { up:false, down:false, left:false, right:false, axis:0, stick:false };
window.addEventListener('keydown', e=>{
  if (['ArrowUp','KeyW'].includes(e.code)) input.up = true;
  if (['ArrowDown','KeyS'].includes(e.code)) input.down = true;
  if (['ArrowLeft','KeyA'].includes(e.code)) input.left = true;
  if (['ArrowRight','KeyD'].includes(e.code)) input.right = true;
});
window.addEventListener('keyup', e=>{
  if (['ArrowUp','KeyW'].includes(e.code)) input.up = false;
  if (['ArrowDown','KeyS'].includes(e.code)) input.down = false;
  if (['ArrowLeft','KeyA'].includes(e.code)) input.left = false;
  if (['ArrowRight','KeyD'].includes(e.code)) input.right = false;
});
function bindTouch(id, key){
  const el = document.getElementById(id);
  const on = (e)=>{ e.preventDefault(); input[key]=true; };
  const off = (e)=>{ e.preventDefault(); input[key]=false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindTouch('btnGas','up');
bindTouch('btnBrake','down');
if ('ontouchstart' in window){ document.getElementById('touch').style.display='block'; }

// ---------- phone landscape: sit much closer to the wheel ----------
// A phone held sideways is a very short window, so the cockpit ends up small and
// far away. On a touch screen in landscape the whole car slides toward the eye,
// which is the same as the driver sitting further forward: the wheel goes from
// 0.60 m to 0.38 m away and reads about 1.6x larger. Desktop is untouched.
const COARSE_POINTER = window.matchMedia
  ? window.matchMedia('(pointer: coarse)').matches
  : ('ontouchstart' in window);
const NEAR_WHEEL_SHIFT = 0.22;
function applyCockpitLayout(){
  const landscape = window.innerWidth > window.innerHeight;
  carFront.position.z = (COARSE_POINTER && landscape) ? NEAR_WHEEL_SHIFT : 0;
}
applyCockpitLayout();
window.addEventListener('resize', applyCockpitLayout);
window.addEventListener('orientationchange', ()=>setTimeout(applyCockpitLayout, 120));

// ---------- floating virtual stick (left half of the screen, steering only) ----------
// Touch down anywhere in the left half: the stick appears under the finger and
// that point becomes the centre. Dragging left/right gives an analog steering
// value between -1 and +1; vertical movement is ignored.
(function(){
  const zone = document.getElementById('stickZone');
  const base = document.getElementById('stickBase');
  const knob = document.getElementById('stickKnob');
  const RADIUS = 70;      // px of travel for full lock
  const DEAD   = 6;       // px dead zone around the centre
  let touchId = null, originX = 0, originY = 0;

  function show(x, y){
    base.style.left = x+'px'; base.style.top = y+'px';
    knob.style.left = x+'px'; knob.style.top = y+'px';
    base.classList.add('on'); knob.classList.add('on');
  }
  function hide(){
    base.classList.remove('on'); knob.classList.remove('on');
  }
  function update(x){
    let dx = x - originX;
    const mag = Math.abs(dx);
    const clamped = Math.max(-RADIUS, Math.min(RADIUS, dx));
    knob.style.left = (originX + clamped)+'px';
    // steer left = negative dx -> input.axis +1 (matches the keyboard's left)
    input.axis = mag < DEAD ? 0 : -clamped/RADIUS;
  }
  function start(x, y){
    originX = x; originY = y;
    input.stick = true; input.axis = 0;
    show(x, y);
  }
  function end(){
    touchId = null; input.stick = false; input.axis = 0; hide();
  }

  zone.addEventListener('touchstart', e=>{
    e.preventDefault();
    if (touchId !== null) return;
    const t = e.changedTouches[0];
    touchId = t.identifier;
    start(t.clientX, t.clientY);
  }, {passive:false});

  zone.addEventListener('touchmove', e=>{
    e.preventDefault();
    for (const t of e.changedTouches){
      if (t.identifier === touchId){ update(t.clientX); break; }
    }
  }, {passive:false});

  ['touchend','touchcancel'].forEach(ev=>{
    zone.addEventListener(ev, e=>{
      e.preventDefault();
      for (const t of e.changedTouches){ if (t.identifier === touchId) end(); }
    }, {passive:false});
  });

  // mouse fallback so the stick can be tried on a desktop browser too
  zone.addEventListener('mousedown', e=>{ e.preventDefault(); touchId = 'mouse'; start(e.clientX, e.clientY); });
  window.addEventListener('mousemove', e=>{ if (touchId === 'mouse') update(e.clientX); });
  window.addEventListener('mouseup',   ()=>{ if (touchId === 'mouse') end(); });
})();

// ---------- helpers ----------
// A circuit that passes over itself cannot be located by a global search on x/z:
// at the spirals two stations share the same ground plan and only differ in
// height, so the search would flip between decks. Instead it walks a window
// around the station the car was on last frame, which is unambiguous - the two
// decks are more than a kilometre apart measured along the lap.
let carStation = 0;
const STATION_WINDOW = 14;   // +-14 samples is about +-300 m at this spacing
function nearestTrackInfo(pos){
  let best = carStation, bestD = Infinity;
  const w = ELEVATED ? STATION_WINDOW : SAMPLES/2;
  for (let k=-w;k<=w;k++){
    const i = ((carStation + k) % SAMPLES + SAMPLES) % SAMPLES;
    const dx = pos.x - trackData[i].pos.x;
    const dz = pos.z - trackData[i].pos.z;
    const dd = dx*dx+dz*dz;
    if (dd < bestD){ bestD = dd; best = i; }
  }
  carStation = best;
  const d = trackData[best];
  const rel = pos.clone().sub(d.pos);
  const lateral = rel.dot(d.right);
  // Where the car sits between this station and the next. Stations are ~22 m
  // apart and the ramps climb at 2.35%, so without this the eye height would
  // jump half a metre at every station boundary.
  const nx = trackData[(best+1)%SAMPLES].pos;
  const abx = nx.x - d.pos.x, abz = nx.z - d.pos.z;
  const len2 = abx*abx + abz*abz;
  let t = len2 > 1e-6 ? ((pos.x - d.pos.x)*abx + (pos.z - d.pos.z)*abz)/len2 : 0;
  t = Math.max(-1, Math.min(1, t));
  return { index: best, frac: best + t, dist: d.dist + t*SEG_LEN, lateral };
}
const SEG_LEN = TRACK_TOTAL_LEN/SAMPLES;

// lap tracking
let lap = 1;
let raceTime = 0;
let lastProgress = 0;
let started = false;

// ---------- render loop ----------
const clock = new THREE.Clock();
let bounceT = 0;
let wheelSpin = 0;
const EYE_HEIGHT = 4.0;   // driver's eye above the road (was 3.0)
let camPitchY = surfaceUnder(0, trackData[0].pos.x, trackData[0].pos.z) + EYE_HEIGHT;
let impactShake = 0; // decays each frame, adds camera kick on collision
const CAR_RADIUS = 0.85;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (started){
    raceTime += dt;

    // --- physics ---
    const info = nearestTrackInfo(car.pos);
    const offroad = Math.abs(info.lateral) > OFFROAD_EDGE;

    const curMax = offroad ? MAX_SPEED*OFFROAD_MAXSPEED_MULT : MAX_SPEED;
    const speedAtFrameStart = car.speed;
    const drag = offroad ? ENGINE_DRAG*OFFROAD_DRAG_MULT : ENGINE_DRAG;

    if (input.up){
      // Acceleration tapers with speed: 80% of the base rate at 1 km/h down to
      // 10% at 300 km/h, interpolated linearly in between.
      const kmhNow = Math.abs(car.speed)*3.6;
      const accelScale = 0.8 * Math.max(0.17, Math.min(0.8,
        0.8 + (0.17 - 0.8) * (kmhNow - 1) / (MAX_KMH - 1)));
      car.speed += ACCEL*accelScale*dt;
    } else if (input.down){
      if (car.speed > 0.5) car.speed -= BRAKE*dt;
      else car.speed -= ACCEL*0.7*dt;
    } else {
      // natural decel toward 0
      if (car.speed > 0) car.speed = Math.max(0, car.speed - drag*dt);
      else if (car.speed < 0) car.speed = Math.min(0, car.speed + drag*dt);
    }
    // Slope affects speed: climbs bleed momentum, descents build it. It is read
    // off the deck rather than the terrain, and scaled by how closely the car is
    // pointed along the road so that crossing it diagonally is not a free climb.
    let slope;
    if (ELEVATED){
      const tg = trackData[info.index].tangent;
      const align = Math.sin(car.heading)*tg.x + Math.cos(car.heading)*tg.z;
      slope = ((deckYAt(info.frac + 1) - deckYAt(info.frac))/SEG_LEN) * align;
    } else {
      const hHere = heightAt(car.pos.x, car.pos.z);
      const hNext = heightAt(car.pos.x + Math.sin(car.heading)*8,
                             car.pos.z + Math.cos(car.heading)*8);
      slope = (hNext - hHere)/8;
    }
    car.speed -= slope * 26 * dt;
    car.speed = Math.max(Math.min(car.speed, MAX_SPEED), -REVERSE_MAX);
    // Off-track the speed cap is not applied instantly: the car bleeds down to
    // it at 30% of the acceleration rate, and the throttle can't fight it.
    if (offroad && car.speed > curMax){
      car.speed = Math.max(curMax, speedAtFrameStart - OFFROAD_DECEL*dt);
    }

    // steering — scaled by speed ratio, works in reverse too (inverted feel omitted for simplicity)
    const speedRatio = Math.min(Math.abs(car.speed)/MAX_SPEED, 1);
    let steerInput = 0;
    if (input.stick){
      steerInput = input.axis;        // analog, -1 .. +1 from the virtual stick
    } else {
      if (input.left) steerInput += 1;
      if (input.right) steerInput -= 1;
    }
    const turnDir = car.speed >= 0 ? 1 : -1;
    // Cornering rate also falls off with speed: 85% of the base rate up to
    // 100 km/h, tapering linearly to 40% at 300 km/h.
    const kmhTurn = Math.abs(car.speed)*3.6;
    const turnScale = kmhTurn <= 100 ? 0.85
      : Math.max(0.4, 0.85 + (0.4 - 0.85) * (kmhTurn - 100) / (MAX_KMH - 100));
    const targetTurn = steerInput * TURN_RATE_MAX * (0.35 + 0.65*speedRatio) * turnScale * turnDir;
    car.heading += targetTurn*dt;

    // smoothed steer angle just for camera lean/fov feel
    car.steerAngle += (steerInput - car.steerAngle)*Math.min(1, dt*6);

    // front tires turn with the steering input
    const tireYaw = car.steerAngle * VISUAL_STEER_MAX;
    tireL.rotation.y = tireYaw;
    tireR.rotation.y = tireYaw;
    // steering wheel rotates the same way the car turns
    steer.rotation.z = car.steerAngle * 0.6;
    // wheels roll forward about their axle (X), not around the steering axis
    wheelSpin += car.speed * dt * 1.7;
    tireL.userData.spin.rotation.x = wheelSpin;
    tireR.userData.spin.rotation.x = wheelSpin;

    // move
    car.pos.x += Math.sin(car.heading)*car.speed*dt;
    car.pos.z += Math.cos(car.heading)*car.speed*dt;

    // --- obstacle collisions ---
    for (let i=0;i<obstacles.length;i++){
      const ob = obstacles[i];
      if (ob.disabled) continue;
      const dx = car.pos.x - ob.pos.x;
      const dz = car.pos.z - ob.pos.y; // Vector2.y stores z
      const distSq = dx*dx + dz*dz;
      const minDist = CAR_RADIUS + ob.radius;
      if (distSq < minDist*minDist && distSq > 0.0001){
        const dist = Math.sqrt(distSq);
        const nx = dx/dist, nz = dz/dist; // direction from obstacle -> car

        if (ob.type === 'pylon'){
          // knock the pylon away, only a slight speed loss for the car
          car.speed *= 0.92;
          car.speed -= 0.6;
          const impulseMag = 7 + Math.abs(car.speed)*0.7;
          ob.vel.set(-nx*impulseMag, -nz*impulseMag); // fly off in the direction the car was heading
          ob.disabled = true; // no longer blocks the car once it's flying
        } else {
          // tree: solid obstacle, push car out + heavy speed loss + shake
          const penetration = minDist - dist;
          car.pos.x += nx*penetration;
          car.pos.z += nz*penetration;
          car.speed *= 0.25;
          car.speed -= 3;
          impactShake = Math.min(1, impactShake + 0.9);
          ob.knockedT = 1;
        }
      }
    }

    // --- barrier walls: the concrete keeps the car inside the circuit ---
    const wallInfo = nearestTrackInfo(car.pos);
    const sgnW = wallInfo.lateral >= 0 ? 1 : -1;
    // the wall the car hits is the wall that got drawn, narrow neck included
    const wallHereOff = clampOff(wallInfo.index*MESH_PER_SAMPLE, sgnW, WALL_OFF, WALL_MIN);
    const overWall = Math.abs(wallInfo.lateral) - (wallHereOff - 1.2);
    if (overWall > 0){
      const dW = trackData[wallInfo.index];
      car.pos.x -= dW.right.x * sgnW * overWall;
      car.pos.z -= dW.right.z * sgnW * overWall;
      car.speed *= 0.5;
      impactShake = Math.min(1, impactShake + 0.7);
    }

    // --- lap detection ---
    const progress = info.dist/TRACK_TOTAL_LEN;
    if (lastProgress > 0.9 && progress < 0.1 && car.speed > 0){
      lap++;
      document.getElementById('lapNum').textContent = Math.min(lap,3);
    }
    lastProgress = progress;

    document.getElementById('offroad').style.opacity = offroad ? '1' : '0';

    // --- HUD ---
    const kmh = Math.round(Math.abs(car.speed)*3.6);
    document.getElementById('speedVal').textContent = kmh;
    // dashboard readout + shift lights
    const gearIdx = Math.max(1, Math.min(8, Math.ceil((Math.abs(car.speed)/MAX_SPEED)*8) || 1));
    const rpmVal = 4000 + Math.round((Math.abs(car.speed)/MAX_SPEED)*9000);
    drawDash(kmh, rpmVal, car.speed < -0.5 ? 'R' : (Math.abs(car.speed) < 0.5 ? 'N' : gearIdx),
             Math.min(lap,3) + '/3', fmtLapTime(raceTime));
    const lit = Math.round(speedRatio * leds.length);
    for (let li=0; li<leds.length; li++){
      leds[li].material.color.setHex(li < lit ? leds[li].userData.col : 0x141414).convertSRGBToLinear();
    }
    document.getElementById('speedBarFill').style.width = Math.min(100, (Math.abs(car.speed)/MAX_SPEED)*100)+'%';

    // --- camera: fixed driver POV ---
    const eyeHeight = EYE_HEIGHT;
    const forwardOffset = 0.15;
    const camPos = car.pos.clone();
    camPos.x += Math.sin(car.heading)*forwardOffset;
    camPos.z += Math.cos(car.heading)*forwardOffset;
    camPos.y = surfaceUnder(info.frac, camPos.x, camPos.z) + eyeHeight;

    // subtle bounce for speed sensation
    bounceT += dt * (7 + speedRatio*13);
    camPos.y += Math.sin(bounceT)*0.05*(0.35+speedRatio)
              + Math.sin(bounceT*2.37)*0.022*speedRatio;

    camera.position.copy(camPos);

    // contact shadow follows the car, offset away from the sun
    carShadow.position.set(car.pos.x + 1.1,
      surfaceUnder(info.frac, car.pos.x, car.pos.z) + 0.30, car.pos.z - 0.8);
    carShadow.rotation.z = -car.heading;

    // keep the single shadow map centred on the car
    sun.target.position.set(car.pos.x, surfaceUnder(info.frac, car.pos.x, car.pos.z), car.pos.z);
    sun.target.updateMatrixWorld();
    sun.position.set(car.pos.x - 260, 150, car.pos.z + 150);

    // aim at the road surface a little way ahead so the view pitches over crests
    const LOOK_AHEAD = 14;
    const aheadX = car.pos.x + Math.sin(car.heading)*LOOK_AHEAD;
    const aheadZ = car.pos.z + Math.cos(car.heading)*LOOK_AHEAD;
    const aheadY = (ELEVATED ? deckYAt(info.frac + LOOK_AHEAD/SEG_LEN)
                              : heightAt(aheadX, aheadZ)) + eyeHeight;
    // smooth the pitch so bumps don't snap the horizon around
    camPitchY += (aheadY - camPitchY) * Math.min(1, dt*3.5);
    const lookTarget = new THREE.Vector3(aheadX, camPitchY, aheadZ);
    // Rebuild orientation from scratch every frame (lookAt sets the quaternion
    // fully, so nothing accumulates), then apply a one-off local roll for lean.
    // Mutating .rotation.y/.z with "+=" after lookAt was the bug that caused
    // the camera to flip upside down over time.
    camera.up.set(0,1,0);
    camera.lookAt(lookTarget);
    // nose-down pitch so the horizon sits above centre and the road runs long
    camera.rotateX(-CAM_PITCH);
    camera.rotateZ(-car.steerAngle*0.10); // local-space roll, safe & non-cumulative

    // high-speed vibration: a fraction of a degree, but it keeps the frame from
    // feeling glassy once the car is really moving
    const vib = Math.pow(speedRatio, 2.2);
    if (vib > 0.01){
      camera.rotateX((Math.random()-0.5)*0.0075*vib);
      camera.rotateZ((Math.random()-0.5)*0.0110*vib);
    }

    // impact shake decays quickly
    if (impactShake > 0){
      camera.rotateX((Math.random()-0.5)*0.05*impactShake);
      camera.rotateZ((Math.random()-0.5)*0.08*impactShake);
      camera.position.y += (Math.random()-0.5)*0.06*impactShake;
      impactShake = Math.max(0, impactShake - dt*3.5);
    }

    // FOV pump for speed sensation
    const targetFov = 80 + speedRatio*20;   // wider pump: the edges of the frame
                                            // sweep past much faster at speed
    camera.fov += (targetFov - camera.fov)*Math.min(1, dt*4);
    camera.updateProjectionMatrix();

    // speed line overlay opacity
    document.getElementById('speedlines').style.opacity =
      (Math.pow(speedRatio, 1.4)*0.85).toFixed(2);

    // minimap
    drawMinimap(car.pos.x, car.pos.z);

    // obstacle hit animations
    for (let i=0;i<obstacles.length;i++){
      const ob = obstacles[i];
      if (ob.type === 'pylon'){
        if (ob.disabled && (Math.abs(ob.vel.x) > 0.02 || Math.abs(ob.vel.y) > 0.02 || ob.fallAngle < Math.PI/2)){
          ob.mesh.position.x += ob.vel.x*dt;
          ob.mesh.position.z += ob.vel.y*dt;
          ob.vel.multiplyScalar(Math.max(0, 1 - dt*2.2));
          ob.fallAngle = Math.min(Math.PI/2, ob.fallAngle + dt*8);
          ob.mesh.rotation.x = ob.fallAngle;
        }
      } else if (ob.knockedT > 0){
        ob.knockedT = Math.max(0, ob.knockedT - dt*2.2);
        ob.mesh.rotation.z = Math.sin(ob.knockedT*Math.PI*3) * ob.knockedT * 0.6;
      } else if (ob.mesh.rotation.z !== 0){
        ob.mesh.rotation.z = 0;
      }
    }
  }

  renderer.render(scene, camera);
}
animate();

// ---------- start ----------
// The course buttons are the only way in: picking one starts the race, so the
// separate START ENGINE button was an extra press that said nothing.
function beginRace(){
  document.getElementById('title').style.display = 'none';
  document.getElementById('stickZone').style.pointerEvents = 'all';
  started = true;
}

// Course buttons: the one already loaded just starts, the other reloads with
// ?course=N&start=1 so the new circuit builds and drops straight into the race.
document.getElementById('courseTag').textContent =
  COURSE_NAMES[COURSE_ID] + " - DRIVER'S EYE VIEW";
document.querySelectorAll('.courseBtn').forEach(btn=>{
  const id = Number(btn.dataset.course);
  if (id === COURSE_ID) btn.classList.add('on');
  btn.addEventListener('click', ()=>{
    if (id === COURSE_ID) beginRace();
    else location.search = '?course=' + id + '&start=1';
  });
});
if (AUTOSTART) beginRace();

})();
</script>
