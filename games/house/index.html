<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>TINY IN THE GIANT'S HOUSE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#1b1430;
    font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:#fff6e0;user-select:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  .panel{position:absolute;background:rgba(40,26,58,.55);border:2px solid #ffd27a;
    border-radius:14px;padding:8px 14px;backdrop-filter:blur(4px);box-shadow:0 0 0 3px rgba(0,0,0,.35)}
  #stats{top:14px;left:14px;font-size:15px;line-height:1.7;letter-spacing:.04em}
  #stats b{color:#ffd27a;font-weight:800}
  #msg{top:44%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:800;
    text-align:center;opacity:0;transition:opacity .3s;white-space:nowrap}
  #mmwrap{top:14px;right:14px;padding:6px 6px 4px}
  #mmtitle{font-size:12px;font-weight:800;color:#ffd27a;text-align:center;letter-spacing:.12em;margin-bottom:3px}
  #mm{display:block;width:150px;height:150px;border-radius:8px;background:rgba(16,10,26,.55)}
  @media (max-width:520px){#mm{width:108px;height:108px}}
  #jw{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:10px}
  .pip{width:16px;height:16px;border-radius:50%;border:3px solid #0e0a1a;background:#4a3a63;
    box-shadow:0 3px 0 #0e0a1a;transition:background .12s,transform .12s}
  .pip.on{background:radial-gradient(circle at 35% 30%,#bff5ff,#3fa8e0);transform:scale(1.15)}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-weight:900;letter-spacing:.06em;border:4px solid #0e0a1a;
    box-shadow:0 6px 0 #0e0a1a;transition:transform .07s,box-shadow .07s}
  .btn:active,.btn.on{transform:translateY(5px);box-shadow:0 1px 0 #0e0a1a}
  #bJump{right:30px;bottom:44px;width:118px;height:118px;font-size:18px;
    background:radial-gradient(circle at 35% 30%,#bff5ff,#3fa8e0);color:#06202e}
  #stick{position:absolute;left:34px;bottom:44px;width:138px;height:138px;border-radius:50%;
    border:4px solid rgba(255,210,122,.5);background:rgba(40,26,58,.35);pointer-events:auto}
  #knob{position:absolute;left:39px;top:39px;width:60px;height:60px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6e0,#c9964a);border:3px solid #0e0a1a}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 40%,#4a3070,#1b1430 70%);z-index:10}
  #start h1{font-size:clamp(28px,7.5vw,54px);color:#ffd27a;letter-spacing:.06em;
    text-shadow:0 5px 0 #8a3f6a,0 0 30px rgba(255,190,110,.45);line-height:1.25}
  #start p{font-size:14px;line-height:2;opacity:.85;max-width:440px}
  #go{margin-top:6px;padding:16px 44px;font-size:20px;font-weight:900;border:none;cursor:pointer;
    border-radius:999px;color:#06202e;background:linear-gradient(180deg,#bff5ff,#3fa8e0);
    box-shadow:0 6px 0 #1d5f8a;font-family:inherit}
  #clear{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;padding:18px;text-align:center;
    background:radial-gradient(ellipse at 50% 40%,#f6f0ff,#d9ccf5 70%);animation:fadein .6s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  #clearImg{max-width:min(78vw,420px);max-height:64vh;object-fit:contain;
    filter:drop-shadow(0 12px 30px rgba(90,60,150,.35))}
  #clearMsg{font-size:clamp(20px,5.5vw,34px);font-weight:900;color:#5b3aa0;line-height:1.5;
    text-shadow:0 3px 0 #fff,0 0 24px rgba(180,150,255,.8)}
  .hide{display:none!important}
</style>
</head>

<div id="start">
  <h1>巨人の家の<br>小さな探検者</h1>
  <p>広間・キッチン・2階の寝室。<br>家具を踏み台に、3段ジャンプでクッキーを10枚集めよう。</p>
  <p style="opacity:.6">PC: WASD 移動 / マウス 視点 / Space ジャンプ<br>スマホ: 左スティック移動 / 画面ドラッグで視点 / JUMP ボタン</p>
  <button id="go">はじめる</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
"use strict";
const T = THREE;

/* ================= レンダラ ================= */
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = T.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);
const canvas = renderer.domElement;

const scene = new T.Scene();
scene.background = new T.Color(0x1c1436);
scene.fog = new T.Fog(0x1c1436, 110, 600);

const camera = new T.PerspectiveCamera(74, innerWidth/innerHeight, 0.1, 1400);
const yawObj = new T.Object3D(), pitchObj = new T.Object3D();
yawObj.add(pitchObj); pitchObj.add(camera); scene.add(yawObj);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= マテリアル ================= */
function ramp(n){
  const d = new Uint8Array(n);
  for(let i=0;i<n;i++) d[i] = Math.round(255*(i/(n-1))**0.75);
  const t = new T.DataTexture(d,n,1,T.LuminanceFormat);
  t.minFilter = t.magFilter = T.NearestFilter; t.needsUpdate = true; return t;
}
const R4 = ramp(4), R5 = ramp(5);
const mk = (c,o={}) => new T.MeshToonMaterial(Object.assign({color:c, gradientMap:R5}, o));
const M = {
  floor:mk(0xa8794f), plank:mk(0x96683f), wall:mk(0xd2bd92), wallHi:mk(0xdccaa4),
  wood:mk(0x8a5a35), wood2:mk(0xb07a4c), wood3:mk(0x6d4326),
  cloth:mk(0xc9455f), cloth2:mk(0x8b3556), cloth3:mk(0x3f7fa0),
  paper:mk(0xe0d2b8), metal:mk(0xa9b5c6), gold:mk(0xe8c05a),
  rug:mk(0x3f6f8c), rug2:mk(0x7a5aa0), stone:mk(0x8e89a6), tile:mk(0xd0d9e0),
  leaf:mk(0x4f9d5e), soil:mk(0x5a4030), glass:mk(0xbfe8ff,{transparent:true,opacity:.55}),
  book:[mk(0x2f7ea8),mk(0xd9793a),mk(0x3f9e6a),mk(0x8b4fa8),mk(0xc9c14a),mk(0xc0405a)]
};

/* ================= ライト ================= */
scene.add(new T.HemisphereLight(0xf2e2c4, 0x2b1f46, 0.52));
const sun = new T.DirectionalLight(0xffe0b0, 0.95); sun.position.set(-140,240,120); scene.add(sun);
const fill = new T.DirectionalLight(0x92aae8, 0.28); fill.position.set(160,120,-180); scene.add(fill);

/* ================= ジオメトリ・ヘルパ ================= */
const world = new T.Group(); scene.add(world);
const boxes = [];

/** 角の丸いボックス（ローポリ感を消すための面取り） */
const rgeoCache = new Map();
function rgeo(w,h,d,r){
  const key = [w,h,d,r].join(',');
  if(rgeoCache.has(key)) return rgeoCache.get(key);
  const bw = Math.max(w-r*2, .01), bh = Math.max(h-r*2, .01), dep = Math.max(d-r*2, .01);
  const s = new T.Shape();
  const x = -bw/2, y = -bh/2, rr = Math.min(r*1.6, bw/2, bh/2);
  s.moveTo(x+rr, y);
  s.lineTo(x+bw-rr, y);      s.quadraticCurveTo(x+bw, y, x+bw, y+rr);
  s.lineTo(x+bw, y+bh-rr);   s.quadraticCurveTo(x+bw, y+bh, x+bw-rr, y+bh);
  s.lineTo(x+rr, y+bh);      s.quadraticCurveTo(x, y+bh, x, y+bh-rr);
  s.lineTo(x, y+rr);         s.quadraticCurveTo(x, y, x+rr, y);
  const g = new T.ExtrudeGeometry(s, {depth:dep, curveSegments:5,
    bevelEnabled:true, bevelSegments:3, bevelSize:r, bevelThickness:r});
  g.translate(0,0,-dep/2); g.computeVertexNormals();
  rgeoCache.set(key, g);
  return g;
}

/**
 * 直方体を配置。round>0 で面取り。solid=true で当たり判定に追加。
 */
function box(w,h,d, x,y,z, mat, solid=true, round=0){
  const g = round > 0 ? rgeo(w,h,d,round) : new T.BoxGeometry(w,h,d,2,2,2);
  const m = new T.Mesh(g, mat);
  m.position.set(x,y,z); world.add(m);
  if(solid) boxes.push({min:new T.Vector3(x-w/2,y-h/2,z-d/2), max:new T.Vector3(x+w/2,y+h/2,z+d/2)});
  return m;
}
function cyl(rt,rb,h, x,y,z, mat, solid=false, seg=24){
  const m = new T.Mesh(new T.CylinderGeometry(rt,rb,h,seg,2), mat);
  m.position.set(x,y,z); world.add(m);
  if(solid){ const r = Math.max(rt,rb);
    boxes.push({min:new T.Vector3(x-r,y-h/2,z-r), max:new T.Vector3(x+r,y+h/2,z+r)}); }
  return m;
}
function sph(r, x,y,z, mat, solid=false){
  const m = new T.Mesh(new T.SphereGeometry(r,28,20), mat);
  m.position.set(x,y,z); world.add(m);
  if(solid) boxes.push({min:new T.Vector3(x-r*.72,y-r,z-r*.72), max:new T.Vector3(x+r*.72,y+r*.9,z+r*.72)});
  return m;
}
function torus(R,r, x,y,z, mat, rx=Math.PI/2){
  const m = new T.Mesh(new T.TorusGeometry(R,r,14,40), mat);
  m.position.set(x,y,z); m.rotation.x = rx; world.add(m); return m;
}
function collider(x0,y0,z0, x1,y1,z1){
  boxes.push({min:new T.Vector3(x0,y0,z0), max:new T.Vector3(x1,y1,z1)});
}

/* ================= 寸法 ================= */
const RW = 300, RD = 300, RH = 156;     // 広間（前回の2倍）
const F2 = 160;                          // 2階の床の高さ
const BH = 210;                          // 寝室の高さ（吹き抜けのある高い天井）
const KX = 306, KW = 280, KD = 260, KZ = 20;   // キッチン

/* ================= 広間 ================= */
box(RW, 8, RD, 0, -4, 0, M.floor, true);
for(let i=0;i<15;i++)                                   // 床板の目地
  box(RW, 0.6, 2.2, 0, 0.3, -RD/2 + 10 + i*20, M.plank, false);
// 壁（腰壁＋モールディング付き）
function wallPanel(w,h,d,x,y,z){
  box(w,h,d, x,y,z, M.wall, true);
  const horiz = d < w;
  box(horiz? w:w*0.6, 40, horiz? d*0.7:d, x, 20, z + (horiz? (z<0?2.6:-2.6):0), M.wallHi, false); // 腰壁
}
box(RW, RH+40, 8, 0, (RH+40)/2-8, -RD/2-4, M.wall, true);      // 奥壁
box(RW, 44, 5, 0, 22, -RD/2+2, M.wallHi, false);
box(RW, 6, 7, 0, 46, -RD/2+2, M.wood2, false, 1.2);            // 見切り縁
box(RW, RH+40, 8, 0, (RH+40)/2-8, RD/2+4, M.wall, true);       // 手前壁
box(8, RH+40, RD, -RW/2-4, (RH+40)/2-8, 0, M.wall, true);      // 左壁
// 右壁：キッチンへの大きな出入口（z 40〜120 / 高さ80）
box(8, RH+40, 170, RW/2+4, (RH+40)/2-8, -65, M.wall, true);
box(8, RH+40, 10,  RW/2+4, (RH+40)/2-8, 145, M.wall, true);
box(8, RH-60, 120, RW/2+4, 128, 80, M.wall, true);             // まぐさ（開口高さ98）
box(16, 12, 136, RW/2, 100, 80, M.wood2, false, 2);            // 開口部の枠
cyl(7,7,196, RW/2-10, 49, 20, M.wood2); cyl(7,7,196, RW/2-10, 49, 140, M.wood2);

/* --- ラグ --- */
const rug = new T.Mesh(new T.CylinderGeometry(72,72,1.4,48), M.rug);
rug.position.set(-16, 0.7, 40); world.add(rug);
torus(60, 3, -16, 1.5, 40, M.rug2);
torus(40, 2.4, -16, 1.5, 40, M.gold);
collider(-88,0,-32, 56,1.4,112);

/* ================= 登坂ルート1：積み木と絵本 ================= */
const blockCols = [M.book[0],M.book[1],M.book[2],M.book[3],M.book[4],M.book[5]];
for(let i=0;i<7;i++){                       // 階段状の積み木（1段ジャンプ）
  const y = i*9;
  box(20,9,20, -104 + i*4, y+4.5, -30 - i*9, blockCols[i%6], true, 2.2);
  box(21,1.2,21, -104 + i*4, y+9.4, -30 - i*9, M.wood2, false, .5);
}
// 絵本の山
[[ -150, 0, -20, 12],[-150, 12, -20, 10],[-136, 22, -40, 11],[-120, 33, -20, 9]].forEach((b,i)=>{
  box(46,b[3],32, b[0], b[1]+b[3]/2, b[2], blockCols[(i+2)%6], true, 1.6);
  box(48,1.6,28, b[0], b[1]+b[3], b[2], M.paper, false, .6);
});

/* ================= 巨大テーブル＋椅子 ================= */
const TX = 60, TZ = 40, TOP = 72;
function tableLeg(x,z){
  cyl(7,9,TOP, x, TOP/2, z, M.wood, true, 20);
  torus(9,2.4, x, TOP*0.32, z, M.wood2);
  torus(9,2.4, x, TOP*0.62, z, M.wood2);
}
[[-46,-34],[46,-34],[-46,34],[46,34]].forEach(d => tableLeg(TX+d[0], TZ+d[1]));

function hitAny(p){
  const x0 = p.x-HW, x1 = p.x+HW, y0 = p.y, y1 = p.y+HH, z0 = p.z-HW, z1 = p.z+HW;
  for(let i=0;i<boxes.length;i++){

let running = false;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
function tryLock(){
  if(isTouch || document.pointerLockElement === canvas) return;
  const r = canvas.requestPointerLock && canvas.requestPointerLock();
  if(r && r.catch) r.catch(() => {});          // 権限がない環境では無視（ドラッグ操作へ）
}
canvas.addEventListener('click', () => { if(running) tryLock(); });
// ドラッグでの視点移動（ポインタロックが使えない場合のフォールバック）
let dragging = false, mx = 0, my = 0;
canvas.addEventListener('mousedown', e => { dragging = true; mx = e.clientX; my = e.clientY; });
addEventListener('mouseup', () => dragging = false);
addEventListener('mouseleave', () => dragging = false);
document.addEventListener('mousemove', e => {
  if(!running) return;
  if(document.pointerLockElement === canvas){
    look(e.movementX*0.0022, e.movementY*0.0022);
  } else if(dragging){
    look((e.clientX-mx)*0.004, (e.clientY-my)*0.004);
    mx = e.clientX; my = e.clientY;
  }
});
canvas.style.cursor = 'grab';
function look(dx,dy){
  yawObj.rotation.y -= dx;
  pitchObj.rotation.x = Math.max(-1.55, Math.min(1.45, pitchObj.rotation.x - dy));
  P.autoLook = 0;
}
let lookId = null, lx = 0, ly = 0;
canvas.addEventListener('touchstart', e => {
  for(const t of e.changedTouches) if(lookId === null){ lookId = t.identifier; lx = t.clientX; ly = t.clientY; }
}, {passive:true});
canvas.addEventListener('touchmove', e => {
  for(const t of e.changedTouches) if(t.identifier === lookId){
    look((t.clientX-lx)*0.005, (t.clientY-ly)*0.005); lx = t.clientX; ly = t.clientY; }
}, {passive:true});
canvas.addEventListener('touchend', e => {
  for(const t of e.changedTouches) if(t.identifier === lookId) lookId = null;
}, {passive:true});

const stick = document.getElementById('stick'), knob = document.getElementById('knob');
const mv = {x:0,y:0}; let sid = null;
function setStick(t){
  const r = stick.getBoundingClientRect();
  let dx = t.clientX-(r.left+r.width/2), dy = t.clientY-(r.top+r.height/2);
  const max = r.width/2-16, L = Math.hypot(dx,dy);
  if(L > max){ dx *= max/L; dy *= max/L; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  mv.x = dx/max; mv.y = dy/max;
}
stick.addEventListener('touchstart', e => { e.preventDefault(); sid = e.changedTouches[0].identifier; setStick(e.changedTouches[0]); });
stick.addEventListener('touchmove', e => { e.preventDefault(); for(const t of e.changedTouches) if(t.identifier === sid) setStick(t); });
stick.addEventListener('touchend', e => {
  for(const t of e.changedTouches) if(t.identifier === sid){ sid = null; mv.x = mv.y = 0; knob.style.transform = 'translate(0,0)'; }
});
const bJump = document.getElementById('bJump');
['touchstart','mousedown'].forEach(ev => bJump.addEventListener(ev, e => { e.preventDefault(); bJump.classList.add('on'); jump(); }));
['touchend','mouseup','mouseleave'].forEach(ev => bJump.addEventListener(ev, () => bJump.classList.remove('on')));

/* ================= ジャンプ ================= */
const pips = document.querySelectorAll('.pip');
const updatePips = () => pips.forEach((p,i) => p.classList.toggle('on', i < 3 - P.jumps));
const rings = [];
function ring(pos, n){
  const col = [0x9fe8ff,0xffe08a,0xffa6e0][Math.min(n,3)-1];
  const m = new T.Mesh(new T.RingGeometry(2.4,4,32),
    new T.MeshBasicMaterial({color:col, transparent:true, side:T.DoubleSide}));
  m.rotation.x = -Math.PI/2; m.position.copy(pos); m.position.y += .6;
  scene.add(m); rings.push({m, life:.6});
}
function jump(){
  if(!running) return;
  if(P.onGround || P.coyote > 0) P.jumps = 0;
  if(P.jumps >= 3) return;
  P.vel.y = JUMPV[P.jumps];
  P.jumps++; P.onGround = false; P.coyote = 0; P.air = 0;
  updatePips();
  if(P.jumps >= 2) P.autoLook = P.jumps === 2 ? -0.62 : -0.95;   // 2段目以降はゆるく足元へ
  ring(P.pos.clone(), P.jumps);
}

  const ox = pad + ((S-pad*2) - (r.x1-r.x0)*sc)/2;
  const oz = pad + ((S-pad*2) - (r.z1-r.z0)*sc)/2;
  const X = x => ox + (x - r.x0)*sc, Z = z => oz + (z - r.z0)*sc;

  mmc.clearRect(0,0,S,S);
  mmc.fillStyle = 'rgba(38,26,58,.85)';
  mmc.fillRect(X(r.x0), Z(r.z0), (r.x1-r.x0)*sc, (r.z1-r.z0)*sc);
  // 部屋の枠
  mmc.strokeStyle = '#ffd27a'; mmc.lineWidth = 5;
  mmc.strokeRect(X(r.x0), Z(r.z0), (r.x1-r.x0)*sc, (r.z1-r.z0)*sc);
  // 別の部屋へ通じる出入口
  const tt = performance.now()*0.003;
  const pulse = 1 + Math.sin(tt)*0.12;
  for(const e of (r.exits || [])){
    const ex = X(e.x), ez = Z(e.z), ang = Math.atan2(e.dx, -e.dz);
    mmc.save(); mmc.translate(ex, ez); mmc.rotate(ang); mmc.scale(pulse, pulse);
    mmc.beginPath(); mmc.moveTo(0,-17); mmc.lineTo(14,7); mmc.lineTo(-14,7); mmc.closePath();
    mmc.fillStyle = '#8affc4'; mmc.fill();
    mmc.lineWidth = 3; mmc.strokeStyle = '#0e2a1e'; mmc.stroke();
    mmc.restore();
    // ラベル：矢印の内側（横矢印は左右、縦矢印は上）に置き、枠内へ収める
    mmc.save();
    mmc.font = 'bold 19px sans-serif'; mmc.textBaseline = 'middle';
    let lx, ly;
    if(e.dx !== 0){ lx = ex - e.dx*22; ly = ez; mmc.textAlign = e.dx > 0 ? 'right' : 'left'; }
    else { lx = ex; ly = ez - 30; mmc.textAlign = 'center'; }
    const wd = mmc.measureText(e.label).width;
    const half = mmc.textAlign === 'center' ? wd/2 : (mmc.textAlign === 'right' ? wd : 0);
    lx = Math.min(Math.max(lx, 6 + half), S - 6 - (wd - half));
    ly = Math.min(Math.max(ly, 14), S - 14);
    mmc.lineWidth = 5; mmc.strokeStyle = 'rgba(10,6,18,.95)';
    mmc.strokeText(e.label, lx, ly);
    mmc.fillStyle = '#8affc4'; mmc.fillText(e.label, lx, ly);
    mmc.restore();
  }

  // クッキー
  const t = performance.now()*0.004;
  for(const c of cookies){
    const p = c.position;
    if(p.x < r.x0-30 || p.x > r.x1+30 || p.z < r.z0-30 || p.z > r.z1+30) continue;
    if(p.y < r.y0 || p.y > r.y1) continue;
    const px = X(p.x), pz = Z(p.z);
    mmc.beginPath(); mmc.arc(px, pz, 12 + Math.sin(t)*3, 0, 6.284);
    mmc.fillStyle = 'rgba(255,190,90,.30)'; mmc.fill();
    mmc.beginPath(); mmc.arc(px, pz, 7, 0, 6.284);
    mmc.fillStyle = '#ffcf6b'; mmc.fill();
    mmc.lineWidth = 3; mmc.strokeStyle = '#5a3418'; mmc.stroke();
  }
  // 自分（向き付きの三角）
  const px = X(P.pos.x), pz = Z(P.pos.z), a = -yawObj.rotation.y;
  mmc.save(); mmc.translate(px, pz); mmc.rotate(a);
  mmc.beginPath(); mmc.moveTo(0,-16); mmc.lineTo(11,12); mmc.lineTo(0,6); mmc.lineTo(-11,12); mmc.closePath();
  mmc.fillStyle = '#7fe3ff'; mmc.fill();
  mmc.lineWidth = 3; mmc.strokeStyle = '#0e2a3a'; mmc.stroke();
  mmc.restore();
}

/* ================= ゲームクリア ================= */
function clearGame(){
  if(!running) return;
  running = false;
  scene.remove(spellBook);
  if(document.pointerLockElement === canvas) document.exitPointerLock();
  document.getElementById('hud').classList.add('hide');
  document.getElementById('clear').classList.remove('hide');
}

/* ================= ループ ================= */
const clock = new T.Clock();
const fwd = new T.Vector3(), right = new T.Vector3(), UP = new T.Vector3(0,1,0), tmp = new T.Vector3();

function step(dt){
  let ix = mv.x, iz = mv.y;
  if(keys.KeyW || keys.ArrowUp) iz -= 1;
  if(keys.KeyS || keys.ArrowDown) iz += 1;
  if(keys.KeyA || keys.ArrowLeft) ix -= 1;
  if(keys.KeyD || keys.ArrowRight) ix += 1;
  const L = Math.hypot(ix,iz); if(L > 1){ ix /= L; iz /= L; }

  camera.getWorldDirection(fwd); fwd.y = 0;
  if(fwd.lengthSq() < 1e-6) fwd.set(0,0,-1).applyAxisAngle(UP, yawObj.rotation.y);
  fwd.normalize();
  right.crossVectors(fwd, UP).normalize();
  const wish = tmp.set(right.x*ix + fwd.x*(-iz), 0, right.z*ix + fwd.z*(-iz));
  const spd = 30 * (P.onGround ? 1 : AIR_RATIO);
  const accel = P.onGround ? 24 : 11;
  P.vel.x += (wish.x*spd - P.vel.x) * Math.min(1, accel*dt);
  P.vel.z += (wish.z*spd - P.vel.z) * Math.min(1, accel*dt);

  let g = P.vel.y > 0 ? GRAV_UP : GRAV;
  if(Math.abs(P.vel.y) < 3.6) g *= 0.6;
  if(P.jumps === 1) g *= 1.85;                        // 1段目だけ重力を強めて滞空時間を70%に
  P.vel.y = Math.max(P.vel.y - g*dt, -45);
  if(!P.onGround) P.air += dt;

  P.onGround = false;
  tmp.copy(P.pos); tmp.x += P.vel.x*dt;
  if(hitAny(tmp)) P.vel.x = 0; else P.pos.x = tmp.x;
  tmp.copy(P.pos); tmp.z += P.vel.z*dt;
  if(hitAny(tmp)) P.vel.z = 0; else P.pos.z = tmp.z;
  tmp.copy(P.pos); tmp.y += P.vel.y*dt;
  const hit = hitAny(tmp);
  if(hit){
    if(P.vel.y <= 0){
      P.pos.y = hit.max.y; P.onGround = true;
      if(P.jumps > 0 || P.air > .3) ring(P.pos.clone(), 1);
      P.jumps = 0; P.air = 0; updatePips();
    } else P.pos.y = hit.min.y - HH - .01;
    P.vel.y = 0;
  } else P.pos.y = tmp.y;

  P.coyote = P.onGround ? .14 : Math.max(0, P.coyote - dt);
  if(P.pos.y < -260){                                    // 地下室（y=-156）より十分下だけやり直し
    P.pos.set(-16,10,96); P.vel.set(0,0,0); say('落ちた！ ラグの上からやり直し');
  }

  // 視点：2段目以降は真下、着地で水平へ
  if(P.autoLook !== 0){
    pitchObj.rotation.x += (P.autoLook - pitchObj.rotation.x) * Math.min(1, 7*dt);
    if(P.onGround) P.autoLook = 0;
  } else if(P.onGround && pitchObj.rotation.x < -0.12){
    pitchObj.rotation.x += (0 - pitchObj.rotation.x) * Math.min(1, 5*dt);
  }

  const moving = P.onGround && (Math.abs(ix)+Math.abs(iz)) > .12;
  P.bob += dt*(moving ? 9 : 3);
  const floaty = P.onGround ? 0 : Math.sin(performance.now()*.0013)*0.22;
  yawObj.position.set(P.pos.x, P.pos.y + EYE + (moving ? Math.sin(P.bob)*0.22 : 0) + floaty, P.pos.z);
  camera.rotation.z += ((P.onGround ? 0 : -P.vel.x*.0006 + Math.sin(P.bob*.5)*.012) - camera.rotation.z)*Math.min(1,5*dt);
  camera.fov += ((P.onGround ? 74 : 77) - camera.fov)*Math.min(1,4*dt);
  camera.updateProjectionMatrix();

  let near = 1e9;
  for(let i=cookies.length-1;i>=0;i--){
    const c = cookies[i];
    c.rotation.z += dt*1.8;
    c.position.y += Math.sin(performance.now()*.002 + i)*dt*.8;
    const d = c.position.distanceTo(yawObj.position);
    if(d < near){ near = d; halo.position.copy(c.position); }
    if(d < 7){
      scene.remove(c); cookies.splice(i,1); P.got++;
      ui.cr.textContent = P.got;
      say(cookies.length ? `🍪 ${P.got}枚目！ 残り ${cookies.length}` : '🍪 10枚コンプリート！');
    }
  }
  ui.alt.textContent = Math.max(0, P.pos.y).toFixed(0);

  // 魔法書
  if(spellBook.parent){
    spellBook.userData.glow.intensity = 1.7 + Math.sin(performance.now()*.004)*0.5;
    if(spellBook.position.distanceTo(yawObj.position) < 22) clearGame();
  }

  for(let i=rings.length-1;i>=0;i--){
    const r = rings[i]; r.life -= dt;
    const k = 1 - r.life/.6;
    r.m.scale.setScalar(1 + k*4); r.m.material.opacity = Math.max(0, 1-k);
    if(r.life <= 0){ scene.remove(r.m); rings.splice(i,1); }
  }
  dust.rotation.y += dt*.008;
  if(P.got >= 1) openDoor();   // 動作確認用：1個でドアが開く
  animDoor(dt);
  drawMap();
}

(function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .04);
  if(running){ step(dt); if(msgT > 0){ msgT -= dt; if(msgT <= 0) ui.msg.style.opacity = 0; } }
  renderer.render(scene, camera);
})();

document.getElementById('go').addEventListener('click', () => {
  document.getElementById('start').classList.add('hide');
  document.getElementById('hud').classList.remove('hide');
  running = true; updatePips();
  if(!isTouch) stick.style.display = 'none';     // PCではバーチャルスティックを表示しない
  tryLock();
  say('左奥の大階段で2階の寝室へ。右の大きなドアの先はキッチン。', 5);
});
})();
</script>
