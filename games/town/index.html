<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>まちあるき — TOWN WALK</title>
<style>
  :root{
    --ink:#1d2430;
    --paper:#f5f1e6;
    --sign:#e8532e;
    --sky:#cfe8f7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1117;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---- HUD ---- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .plate{
    position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;
    background:rgba(20,26,36,.62);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.14);border-radius:10px;
    padding:8px 12px;color:#eaf2ff;font-size:12px;line-height:1.55;letter-spacing:.02em}
  .plate b{font-size:13px;letter-spacing:.14em;display:block;margin-bottom:3px;color:#ffd98a}
  .plate kbd{background:rgba(255,255,255,.14);border-radius:4px;padding:1px 5px;
    font-family:inherit;font-size:11px}
  #speedo{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;
    background:rgba(20,26,36,.62);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.14);border-radius:10px;
    padding:8px 12px;color:#eaf2ff;font-size:11px;text-align:right;min-width:104px}
  #speedo .v{font-size:22px;font-weight:700;color:#8fe3a0;letter-spacing:.04em}
  #speedo .v.run{color:#ffd166}

  /* ---- touch controls ---- */
  #stick{position:absolute;left:0;bottom:0;width:46%;height:52%;pointer-events:auto;display:none}
  #stickBase{position:absolute;width:120px;height:120px;border-radius:50%;
    border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.07);
    transform:translate(-50%,-50%);opacity:0;transition:opacity .15s}
  #stickKnob{position:absolute;width:54px;height:54px;border-radius:50%;
    background:rgba(255,255,255,.55);transform:translate(-50%,-50%);opacity:0;transition:opacity .15s}
  #runBtn{position:absolute;right:20px;bottom:calc(28px + env(safe-area-inset-bottom));
    width:88px;height:88px;border-radius:50%;pointer-events:auto;display:none;
    border:2px solid rgba(255,255,255,.35);background:rgba(232,83,46,.35);
    color:#fff;font-size:15px;font-weight:700;letter-spacing:.1em;
    align-items:center;justify-content:center}
  #runBtn.on{background:rgba(255,209,102,.6);border-color:#ffd166}

  /* ---- loader / error ---- */
  #boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#141b26,#0d1117);color:#e8eef7;text-align:center;padding:24px}
  #boot .box{max-width:420px}
  #boot h1{font-size:15px;letter-spacing:.34em;font-weight:600;color:#ffd98a;margin-bottom:14px}
  #boot p{font-size:13px;line-height:1.8;color:#9fb0c6}
  #boot code{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:4px;font-size:12px}
  #pick{margin-top:18px;display:none}
  #pick label{display:inline-block;background:#e8532e;color:#fff;padding:10px 20px;
    border-radius:8px;font-size:13px;cursor:pointer}
  #pick input{display:none}
  .bar{width:180px;height:3px;background:rgba(255,255,255,.14);border-radius:2px;margin:18px auto 0;overflow:hidden}
  .bar i{display:block;height:100%;width:30%;background:#ffd98a;border-radius:2px;
    animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="plate">
    <b>まちあるき</b>
    <kbd>W A S D</kbd> 移動 ／ <kbd>Shift</kbd> 走る<br>
    ドラッグで視点 ／ ホイールで寄り引き
  </div>
  <div id="speedo"><div class="v" id="spd">0.0</div>km/h</div>
  <div id="stick"><div id="stickBase"></div><div id="stickKnob"></div></div>
  <button id="runBtn">RUN</button>
</div>

<div id="boot"><div class="box">
  <h1>TOWN WALK</h1>
  <p id="bootMsg">住宅街を組み立てています…</p>
  <div class="bar"><i></i></div>
  <div id="pick"><label>GLBファイルを選ぶ<input type="file" id="fileIn" accept=".glb,.gltf"></label></div>
</div></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

/* ==================================================================
   0. 基本セットアップ
   ================================================================== */
const MODEL_URL = './cute_elementary_boy.glb';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe8f7, 70, 190);

const camera = new THREE.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 600);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* --- 空 --- */
{
  const g = new THREE.SphereGeometry(300, 24, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms:{ top:{value:new THREE.Color(0x5fa8e0)}, bot:{value:new THREE.Color(0xdff0fa)} },
    vertexShader:`varying float h; void main(){ h = normalize(position).y;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader:`varying float h; uniform vec3 top; uniform vec3 bot;
      void main(){ gl_FragColor = vec4(mix(bot, top, smoothstep(-0.05,0.55,h)), 1.); }`
  });
  scene.add(new THREE.Mesh(g,m));
}

/* --- ライト --- */
scene.add(new THREE.HemisphereLight(0xbfe0ff, 0x6a6a58, 1.05));
const sun = new THREE.DirectionalLight(0xfff4dc, 1.7);
sun.position.set(48, 70, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
{
  const c = sun.shadow.camera;
  c.left=-95; c.right=95; c.top=95; c.bottom=-95; c.near=1; c.far=200;
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 0.03;
}
scene.add(sun, sun.target);

/* --- トゥーン用グラデーション --- */
function gradMap(steps){
  const d = new Uint8Array(steps*4);
  for(let i=0;i<steps;i++){
    const v = Math.round(255 * (0.55 + 0.45*(i/(steps-1))));
    d[i*4]=d[i*4+1]=d[i*4+2]=v; d[i*4+3]=255;
  }
  const t = new THREE.DataTexture(d, steps, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
}
const GRAD = gradMap(4);

function toon(color){
  return new THREE.MeshToonMaterial({ color, gradientMap: GRAD });
}

/* ==================================================================
   1. 住宅街の生成
   ================================================================== */
const PAL = {
  asphalt:0x53585f, line:0xe8e3d4, curb:0xb8b2a4, sidewalk:0xcac3b3,
  grass:0x7ea75d, dirt:0x9c8a6a,
  wallA:0xf0e8d8, wallB:0xe3d5bd, wallC:0xdfe6ea, wallD:0xe8ddd6,
  roofA:0x3f4a5a, roofB:0x6d4a3c, roofC:0x47614f, roofD:0x8a4b4b,
  block:0xcfc9bb, hedge:0x4c7c3d, glass:0x9fc4d8, door:0x7a5236,
  metal:0x9aa0a6, pole:0xa8a397, wood:0x8a6b4a, red:0xd8452f,
  car1:0xe0e4e8, car2:0x3b6ea5, car3:0xd9534f, tire:0x2a2c30,
  trunk:0x6b4f3a, leaf:0x548c3e, leaf2:0x6ba14a, vend:0xd8452f, sign:0xf0f0ea
};

// 色ごとにジオメトリを溜めて最後に統合する（描画コール削減）
const bucket = new Map();
function push(geo, colorKey, x, y, z, ry=0, rx=0){
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, 0, 'YXZ'));
  m.compose(new THREE.Vector3(x,y,z), q, new THREE.Vector3(1,1,1));
  const g = geo.clone().applyMatrix4(m);
  if(!bucket.has(colorKey)) bucket.set(colorKey, []);
  bucket.get(colorKey).push(g);
}
const BOX = new THREE.BoxGeometry(1,1,1);
function box(w,h,d, colorKey, x,y,z, ry=0){
  push(new THREE.BoxGeometry(w,h,d), colorKey, x,y,z, ry);
}

// 切妻屋根（三角柱）
function prismGeo(w,h,d){
  const hw=w/2, hd=d/2;
  const v = new Float32Array([
    -hw,0,-hd,  hw,0,-hd,  0,h,-hd,     // 前面
    -hw,0, hd,  hw,0, hd,  0,h, hd,     // 背面
  ]);
  const idx = [0,2,1, 3,4,5, 0,3,5, 0,5,2, 1,2,5, 1,5,4, 0,1,4, 0,4,3];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(v,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* --- 当たり判定 AABB --- */
const solids = [];  // {x,z,hw,hd}
function solid(x,z,hw,hd){ solids.push({x,z,hw,hd}); }

/* --- 家 1軒 --- */
const wallKeys = ['wallA','wallB','wallC','wallD'];
const roofKeys = ['roofA','roofB','roofC','roofD'];
let rngState = 20260815;
function rnd(){ rngState = (rngState*1664525 + 1013904223) & 0x7fffffff; return rngState/0x7fffffff; }
function pick(a){ return a[Math.floor(rnd()*a.length)|0]; }

function house(cx, cz, facing){
  // facing: 0=+Z向き, 1=-Z, 2=+X, 3=-X  → 玄関側
  const twoStory = rnd() > 0.42;
  const w = 7.2 + rnd()*2.2;
  const d = 6.0 + rnd()*1.6;
  const h = twoStory ? 5.6 : 3.2;
  const wk = pick(wallKeys), rk = pick(roofKeys);
  const ry = facing===0?0 : facing===1?Math.PI : facing===2?Math.PI/2 : -Math.PI/2;

  const G = new THREE.Group(); // 位置合わせ用に一旦ローカル座標で作る
  const local = [];
  const L = (geo,key,x,y,z,rot=0)=>local.push({geo,key,x,y,z,rot});

  // 躯体
  L(new THREE.BoxGeometry(w,h,d), wk, 0, h/2, 0);
  // 基礎
  L(new THREE.BoxGeometry(w+0.3,0.45,d+0.3), 'curb', 0, 0.22, 0);
  // 屋根
  L(prismGeo(w+1.0, 2.0, d+0.9), rk, 0, h, 0);
  // 玄関（-Z面）
  L(new THREE.BoxGeometry(1.05,2.1,0.14), 'door', -w/4, 1.05, -d/2-0.05);
  L(new THREE.BoxGeometry(1.6,0.16,1.0), rk, -w/4, 2.35, -d/2-0.4);
  L(new THREE.BoxGeometry(1.5,0.14,0.9), 'curb', -w/4, 0.14, -d/2-0.45);
  // 窓
  const winG = new THREE.BoxGeometry(1.5,1.15,0.1);
  L(winG,'glass', w/4, 1.35, -d/2-0.02);
  if(twoStory){
    L(winG,'glass', -w/4, 4.0, -d/2-0.02);
    L(winG,'glass',  w/4, 4.0, -d/2-0.02);
    // ベランダ
    L(new THREE.BoxGeometry(w*0.55,0.1,1.1),'curb', w/8, 3.35, -d/2-0.5);
    L(new THREE.BoxGeometry(w*0.55,0.85,0.08),'metal', w/8, 3.75, -d/2-1.0);
  }
  L(new THREE.BoxGeometry(0.1,1.2,1.6),'glass', w/2+0.02, 1.4, 0.6);
  L(new THREE.BoxGeometry(0.1,1.2,1.6),'glass', -w/2-0.02, 1.4, -0.6);

  // 敷地まわり：ブロック塀
  const lw = 15.4, ld = 15.4;
  for(const s of [[0,-ld/2,lw,0.28],[0,ld/2,lw,0.28],[-lw/2,0,0.28,ld],[lw/2,0,0.28,ld]]){
    // 正面（-Z）は門で開ける
    if(s[1] === -ld/2){
      L(new THREE.BoxGeometry(4.6,0.9,0.28),'block', -lw/2+2.3, 0.45, -ld/2);
      L(new THREE.BoxGeometry(4.6,0.9,0.28),'block',  lw/2-2.3, 0.45, -ld/2);
      L(new THREE.BoxGeometry(0.32,1.4,0.32),'block', -1.6, 0.7, -ld/2);
      L(new THREE.BoxGeometry(0.32,1.4,0.32),'block',  1.6, 0.7, -ld/2);
      continue;
    }
    L(new THREE.BoxGeometry(s[2],0.9,s[3]),'block', s[0],0.45,s[1]);
    if(rnd()>0.5) L(new THREE.BoxGeometry(s[2]*0.96,0.9,s[3]*0.96),'hedge', s[0],1.3,s[1]);
  }
  // アプローチ
  L(new THREE.BoxGeometry(1.6,0.06,ld/2-d/2),'sidewalk', -w/4, 0.05, -(d/2+ (ld/2-d/2)/2));
  // 庭
  L(new THREE.BoxGeometry(lw-0.6,0.04,ld-0.6),'grass', 0, 0.02, 0);
  // カーポート
  if(rnd()>0.45){
    L(new THREE.BoxGeometry(3.2,0.06,5.0),'sidewalk', w/4+1.2, 0.06, -d/2-2.6);
    L(new THREE.BoxGeometry(3.6,0.12,5.2),'metal', w/4+1.2, 2.5, -d/2-2.6);
    for(const px of [-1.6,1.6]) L(new THREE.BoxGeometry(0.16,2.5,0.16),'metal', w/4+1.2+px, 1.25, -d/2-4.9);
    // 車
    if(rnd()>0.4){
      const ck = pick(['car1','car2','car3']);
      L(new THREE.BoxGeometry(1.9,0.85,4.2), ck, w/4+1.2, 0.75, -d/2-2.6);
      L(new THREE.BoxGeometry(1.7,0.7,2.2), 'glass', w/4+1.2, 1.5, -d/2-2.9);
      for(const [tx,tz] of [[-0.95,1.4],[0.95,1.4],[-0.95,-1.4],[0.95,-1.4]])
        L(new THREE.CylinderGeometry(0.34,0.34,0.26,10),'tire', w/4+1.2+tx, 0.35, -d/2-2.6+tz, Math.PI/2);
    }
  }
  // 植木
  const tn = 1 + (rnd()*3|0);
  for(let i=0;i<tn;i++){
    const tx = (rnd()-0.5)*(lw-3), tz = (rnd()-0.5)*(ld-3);
    if(Math.abs(tx)<w/2+0.8 && Math.abs(tz)<d/2+0.8) continue;
    const th = 1.6+rnd()*1.6;
    L(new THREE.CylinderGeometry(0.13,0.17,th,7),'trunk', tx, th/2, tz);
    L(new THREE.IcosahedronGeometry(0.8+rnd()*0.55, 0),'leaf', tx, th+0.5, tz);
  }

  // ローカル→ワールドへ回転して投入
  const rot = new THREE.Matrix4().makeRotationY(ry);
  for(const it of local){
    const m = new THREE.Matrix4()
      .makeRotationY(it.rot)
      .premultiply(new THREE.Matrix4().makeTranslation(it.x,it.y,it.z))
      .premultiply(rot)
      .premultiply(new THREE.Matrix4().makeTranslation(cx,0,cz));
    const g = it.geo.clone().applyMatrix4(m);
    if(!bucket.has(it.key)) bucket.set(it.key,[]);
    bucket.get(it.key).push(g);
  }
  // 当たり判定（躯体と塀）
  const sw = (facing<2? w : d)/2, sd = (facing<2? d : w)/2;
  solid(cx, cz, sw, sd);
  return G;
}

/* --- 道路網 --- */
const ROAD = 9;        // 車道幅
const CELL = 46;       // 街区ピッチ
const NB   = 3;        // 3×3 街区
const HALF = (NB*CELL)/2;

function buildTown(){
  // 地面
  box(HALF*2+40, 0.2, HALF*2+40, 'grass', 0, -0.1, 0);

  const lines = [];
  for(let i=0;i<=NB;i++) lines.push(-HALF + i*CELL);

  for(const p of lines){
    // 東西方向の道
    box(HALF*2+ROAD, 0.06, ROAD, 'asphalt', 0, 0.03, p);
    box(HALF*2+ROAD, 0.16, 3.0, 'sidewalk', 0, 0.08, p - ROAD/2 - 1.5);
    box(HALF*2+ROAD, 0.16, 3.0, 'sidewalk', 0, 0.08, p + ROAD/2 + 1.5);
    // 南北方向の道
    box(ROAD, 0.06, HALF*2+ROAD, 'asphalt', p, 0.03, 0);
    box(3.0, 0.16, HALF*2+ROAD, 'sidewalk', p - ROAD/2 - 1.5, 0.08, 0);
    box(3.0, 0.16, HALF*2+ROAD, 'sidewalk', p + ROAD/2 + 1.5, 0.08, 0);
    // センターライン
    for(let t=-HALF; t<HALF; t+=4.4){
      if(lines.some(L=>Math.abs(t-L)<ROAD/2+1)) continue;
      box(2.4,0.02,0.16,'line', t, 0.07, p);
      box(0.16,0.02,2.4,'line', p, 0.07, t);
    }
  }

  // 街区に家を配置
  for(let bx=0;bx<NB;bx++){
    for(let bz=0;bz<NB;bz++){
      const cx = -HALF + CELL*bx + CELL/2;
      const cz = -HALF + CELL*bz + CELL/2;
      const off = 9.4;
      house(cx-off, cz-off, 1);
      house(cx+off, cz-off, 1);
      house(cx-off, cz+off, 0);
      house(cx+off, cz+off, 0);
    }
  }

  // 電柱＋電線
  const poles = [];
  for(const p of lines){
    for(let t=-HALF+8; t<=HALF-8; t+=CELL/2){
      for(const [px,pz] of [[t, p-ROAD/2-2.4],[p+ROAD/2+2.4, t]]){
        if(Math.abs(px)>HALF+4||Math.abs(pz)>HALF+4) continue;
        box(0.28,8.0,0.28,'pole', px, 4.0, pz);
        box(1.9,0.14,0.14,'pole', px, 7.3, pz);
        box(1.5,0.12,0.12,'pole', px, 6.7, pz);
        box(0.5,0.7,0.42,'metal', px, 5.4, pz);
        solid(px,pz,0.3,0.3);
        poles.push([px,pz]);
      }
    }
  }
  // 電線（近い電柱同士）
  const wireGeo = [];
  for(let i=0;i<poles.length;i++)for(let j=i+1;j<poles.length;j++){
    const dx=poles[i][0]-poles[j][0], dz=poles[i][1]-poles[j][1];
    const dist=Math.hypot(dx,dz);
    if(dist>CELL/2+1) continue;
    for(const yo of [7.3, 6.7]){
      const pts=[];
      for(let k=0;k<=8;k++){
        const t=k/8;
        pts.push(new THREE.Vector3(
          poles[i][0]+(poles[j][0]-poles[i][0])*t,
          yo - Math.sin(t*Math.PI)*0.45,
          poles[i][1]+(poles[j][1]-poles[i][1])*t));
      }
      const curve = new THREE.CatmullRomCurve3(pts);
      wireGeo.push(new THREE.TubeGeometry(curve, 8, 0.035, 4, false));
    }
  }
  if(wireGeo.length){
    const merged = BGU.mergeGeometries(wireGeo);
    const wire = new THREE.Mesh(merged, new THREE.MeshBasicMaterial({color:0x2b3038}));
    scene.add(wire);
  }

  // 街灯・自販機・ガードレール的な小物
  for(const p of lines){
    for(let t=-HALF+CELL/2; t<HALF; t+=CELL){
      box(0.18,5.2,0.18,'metal', t, 2.6, p-ROAD/2-2.0);
      box(1.1,0.16,0.3,'metal', t+0.45, 5.15, p-ROAD/2-2.0);
      box(0.7,0.22,0.34,'sign', t+0.85, 5.0, p-ROAD/2-2.0);
      solid(t,p-ROAD/2-2.0,0.25,0.25);
    }
  }
  // 自販機を交差点に何台か
  const vm = [[-HALF+2.5, -HALF+CELL-6.5],[HALF-3.0, CELL/2],[ -CELL/2, HALF-3.0]];
  for(const [vx,vz] of vm){
    box(1.2,1.9,0.75,'vend', vx, 0.95, vz);
    box(0.9,1.0,0.06,'glass', vx, 1.25, vz-0.4);
    box(1.24,0.2,0.79,'sign', vx, 1.98, vz);
    solid(vx,vz,0.7,0.5);
  }

  // 公園（中央街区をひとつ潰す代わりに、外周に小さな広場）
  const px0 = 0, pz0 = -HALF - 14;
  box(24,0.08,18,'dirt', px0, 0.05, pz0);
  box(22,0.06,16,'grass', px0, 0.09, pz0);
  for(let i=0;i<7;i++){
    const tx = px0 + (rnd()-0.5)*20, tz = pz0 + (rnd()-0.5)*14;
    const th = 3.2+rnd()*2.4;
    push(new THREE.CylinderGeometry(0.22,0.3,th,8),'trunk',tx,th/2,tz);
    push(new THREE.IcosahedronGeometry(1.5+rnd()*0.9,0),'leaf2',tx,th+1.0,tz);
    solid(tx,tz,0.35,0.35);
  }
  // ベンチ
  for(const bx2 of [-6,6]){
    box(2.4,0.12,0.6,'wood', px0+bx2, 0.5, pz0+6);
    box(2.4,0.6,0.12,'wood', px0+bx2, 0.8, pz0+6.28);
    box(0.14,0.5,0.5,'metal', px0+bx2-1.0, 0.25, pz0+6);
    box(0.14,0.5,0.5,'metal', px0+bx2+1.0, 0.25, pz0+6);
  }
  // 外周の壁（見えない当たり）
  const B = HALF + 26;
  for(const s of [[0,-B,B,1],[0,B,B,1],[-B,0,1,B],[B,0,1,B]]) solid(s[0],s[1],s[2],s[3]);
}

buildTown();

/* --- 統合してシーンへ --- */
const townMeshes = [];
for(const [key, geos] of bucket){
  if(!geos.length) continue;
  // 屋根の三角柱だけ uv を持たないため、統合前に属性を揃える
  for(const g of geos){ g.deleteAttribute('uv'); g.deleteAttribute('uv1'); g.deleteAttribute('normal'); }
  const merged = BGU.mergeGeometries(geos, false);
  if(!merged) continue;
  merged.computeVertexNormals();
  const mesh = new THREE.Mesh(merged, toon(PAL[key] ?? 0xff00ff));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  townMeshes.push(mesh);
  geos.length = 0;
}
bucket.clear();

/* ==================================================================
   2. プレイヤー（GLB）
   ================================================================== */
const player = new THREE.Group();
player.position.set(0, 0, -HALF + CELL/2 - ROAD/2 - 2 + 2);
scene.add(player);

const SCALE = 0.5;
const FOOT_Y = 1.47;   // モデル原点から足裏までの距離

const rig = { root:null, arms:{}, legs:{}, head:null, ready:false };

function buildCharacter(gltf){
  const src = gltf.scene;

  // traverse の最中に子を足すと再帰が止まらなくなるため、先に一覧を取る
  const parts = [];
  src.traverse(o=>{ if(o.isMesh) parts.push(o); });

  // 法線を作る（このGLBには NORMAL 属性が無い）
  for(const o of parts){
    o.geometry.computeVertexNormals();
    const c = o.material?.color ? o.material.color.clone() : new THREE.Color(0xcccccc);
    o.material = toon(c);
    o.castShadow = true;
    o.receiveShadow = true;
  }

  // --- 回転中心の付け直し ---
  // このGLBは全パーツが world 直下のフラット構成で、位置は頂点に焼き込まれている。
  // 目的の支点にジオメトリを平行移動してから、支点位置のGroupへ入れ直す。
  // GLTFLoader はノード名の記号を落とすことがある（Lace_1_-0.06 → Lace_1_-006）ため
  // 完全一致ではなく述語で拾う。
  function jointFrom(match, pivot){
    const g = new THREE.Group();
    g.position.set(pivot[0], pivot[1], pivot[2]);
    for(const o of parts){
      if(!match(o.name)) continue;
      o.geometry = o.geometry.clone();
      o.geometry.translate(-pivot[0], -pivot[1], -pivot[2]);
      g.add(o);
    }
    return g;
  }

  const armParts = s => n => n===`UpperArm_${s}` || n===`Forearm_${s}` || n===`Hand_${s}`;
  const legParts = s => n => n===`Leg_${s}` || n===`Shoe_${s}` || n===`Sole_${s}`
                             || n.startsWith(`Lace_${s}_`);

  // 肩：腕はTポーズ（±X方向に水平）。swing 用の親と、垂らす用の子に分ける。
  for(const [side, sign] of [['1',1],['-1',-1]]){
    const swing = new THREE.Group();
    swing.position.set(sign*0.19, -0.02, 0);
    const drop = jointFrom(armParts(side), [sign*0.19, -0.02, 0]);
    drop.position.set(0,0,0);
    drop.rotation.z = -sign * 1.36;     // 水平 → 体側へ下ろす
    swing.add(drop);
    src.add(swing);
    rig.arms[side] = { swing, drop };
  }

  // 股関節
  for(const [side, sign] of [['1',1],['-1',-1]]){
    const hip = jointFrom(legParts(side), [sign*0.34, -0.77, 0]);
    src.add(hip);
    rig.legs[side] = hip;
  }

  rig.head = src.getObjectByName('Head');

  // アウトラインは支点付け直しが終わってから。ジオメトリが差し替わるため順序が重要。
  const outlineMat = new THREE.MeshBasicMaterial({color:0x1b2029, side:THREE.BackSide});
  for(const o of parts){
    const out = new THREE.Mesh(o.geometry, outlineMat);
    out.scale.setScalar(1.05);
    o.add(out);
  }

  const inner = new THREE.Group();
  inner.add(src);
  inner.rotation.y = Math.PI;          // モデルは -Z 向き → +Z を正面にする
  inner.scale.setScalar(SCALE);
  inner.position.y = FOOT_Y * SCALE;   // 足裏を地面に合わせる
  player.add(inner);

  rig.root = src;
  rig.inner = inner;
  rig.ready = true;
}

/* ==================================================================
   3. 入力
   ================================================================== */
const keys = new Set();
addEventListener('keydown', e=>{
  keys.add(e.code);
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e=> keys.delete(e.code));
addEventListener('blur', ()=> keys.clear());

let yaw = 0, pitch = 0.22, dist = 7.0;
const move = {x:0, y:0};   // -1..1
let running = false;

// --- マウス ---
let dragId = null, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', e=>{
  if(e.pointerType === 'touch') return;
  dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
  renderer.domElement.setPointerCapture?.(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e=>{
  if(e.pointerId !== dragId) return;
  yaw   -= (e.clientX - lastX) * 0.0042;
  pitch -= (e.clientY - lastY) * 0.0032;
  pitch = Math.max(-0.25, Math.min(0.85, pitch));
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('pointerup', e=>{ if(e.pointerId === dragId) dragId = null; });
renderer.domElement.addEventListener('wheel', e=>{
  dist = Math.max(3.2, Math.min(14, dist + e.deltaY*0.006));
  e.preventDefault();
}, {passive:false});

// --- タッチ ---
const isTouch = matchMedia('(pointer:coarse)').matches;
const stick = document.getElementById('stick');
const sBase = document.getElementById('stickBase');
const sKnob = document.getElementById('stickKnob');
const runBtn = document.getElementById('runBtn');

if(isTouch){
  stick.style.display = 'block';
  runBtn.style.display = 'flex';
  document.querySelector('.plate').innerHTML =
    '<b>まちあるき</b>左でスティック操作<br>右をなぞって視点 ／ RUNで走る';

  let sid = null, ox = 0, oy = 0;
  const R = 52;
  stick.addEventListener('pointerdown', e=>{
    sid = e.pointerId; ox = e.clientX; oy = e.clientY;
    const r = stick.getBoundingClientRect();
    sBase.style.left = sKnob.style.left = (ox - r.left)+'px';
    sBase.style.top  = sKnob.style.top  = (oy - r.top)+'px';
    sBase.style.opacity = sKnob.style.opacity = 1;
    try{ stick.setPointerCapture(e.pointerId); }catch(_){}
  });
  stick.addEventListener('pointermove', e=>{
    if(e.pointerId !== sid) return;
    let dx = e.clientX - ox, dy = e.clientY - oy;
    const len = Math.hypot(dx,dy);
    if(len > R){ dx *= R/len; dy *= R/len; }
    const r = stick.getBoundingClientRect();
    sKnob.style.left = (ox - r.left + dx)+'px';
    sKnob.style.top  = (oy - r.top  + dy)+'px';
    move.x = dx/R; move.y = -dy/R;
  });
  const endStick = e=>{
    if(e.pointerId !== sid) return;
    sid = null; move.x = move.y = 0;
    sBase.style.opacity = sKnob.style.opacity = 0;
  };
  stick.addEventListener('pointerup', endStick);
  stick.addEventListener('pointercancel', endStick);

  // 右半分＝視点
  const look = new Map();
  renderer.domElement.addEventListener('pointerdown', e=>{
    if(e.pointerType !== 'touch') return;
    if(e.clientX < innerWidth*0.46) return;
    look.set(e.pointerId, {x:e.clientX, y:e.clientY});
  });
  renderer.domElement.addEventListener('pointermove', e=>{
    const p = look.get(e.pointerId);
    if(!p) return;
    yaw   -= (e.clientX - p.x) * 0.0055;
    pitch -= (e.clientY - p.y) * 0.004;
    pitch = Math.max(-0.25, Math.min(0.85, pitch));
    p.x = e.clientX; p.y = e.clientY;
  });
  const endLook = e=> look.delete(e.pointerId);
  addEventListener('pointerup', endLook);
  addEventListener('pointercancel', endLook);

  const setRun = v =>{ running = v; runBtn.classList.toggle('on', v); };
  runBtn.addEventListener('pointerdown', e=>{ e.preventDefault(); setRun(true); });
  runBtn.addEventListener('pointerup',   ()=> setRun(false));
  runBtn.addEventListener('pointercancel',()=> setRun(false));
}

/* ==================================================================
   4. 移動と当たり判定
   ================================================================== */
const RADIUS = 0.42;
const WALK = 2.4, RUN = 6.2;

function resolve(pos){
  for(const s of solids){
    const dx = pos.x - s.x, dz = pos.z - s.z;
    const ox = s.hw + RADIUS - Math.abs(dx);
    const oz = s.hd + RADIUS - Math.abs(dz);
    if(ox > 0 && oz > 0){
      if(ox < oz) pos.x += Math.sign(dx||1) * ox;
      else        pos.z += Math.sign(dz||1) * oz;
    }
  }
}

let heading = 0;      // モデルの向き
let speed = 0;        // 現在の水平速度
let cycle = 0;        // 歩行サイクル位相
let bobT = 0;

const camPos = new THREE.Vector3();
const camAim = new THREE.Vector3();
const ray = new THREE.Raycaster();

function tick(dt){
  // 入力 → ワールド方向
  let ix = move.x, iy = move.y;
  if(keys.has('KeyW')||keys.has('ArrowUp'))    iy += 1;
  if(keys.has('KeyS')||keys.has('ArrowDown'))  iy -= 1;
  if(keys.has('KeyA')||keys.has('ArrowLeft'))  ix -= 1;
  if(keys.has('KeyD')||keys.has('ArrowRight')) ix += 1;
  const kl = Math.hypot(ix,iy);
  if(kl > 1){ ix/=kl; iy/=kl; }
  const inLen = Math.min(1, Math.hypot(ix,iy));

  const isRun = running || keys.has('ShiftLeft') || keys.has('ShiftRight');
  const target = inLen * (isRun ? RUN : WALK);
  speed += (target - speed) * Math.min(1, dt * (target > speed ? 7 : 11));
  if(speed < 0.02) speed = 0;

  if(inLen > 0.02){
    // カメラのyaw基準で進行方向を決める
    const fx = Math.sin(yaw), fz = Math.cos(yaw);
    const dx = ix * fz + iy * fx;
    const dz = -ix * fx + iy * fz;
    heading = Math.atan2(dx, dz);
    const np = player.position.clone();
    np.x += dx * speed * dt;
    np.z += dz * speed * dt;
    resolve(np);
    player.position.copy(np);
  }

  // 向きを滑らかに追従
  let diff = heading - player.rotation.y;
  while(diff >  Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  player.rotation.y += diff * Math.min(1, dt*13);

  // --- アニメーション ---
  if(rig.ready){
    const norm = speed / RUN;                        // 0..1
    const freq = 2.0 + norm * 6.4;
    cycle += dt * freq * (speed > 0.05 ? 1 : 0);
    const amp  = Math.min(1, speed / WALK) * (isRun ? 1.35 : 1.0);
    const s = Math.sin(cycle * Math.PI);

    rig.legs['1'].rotation.x   =  s * 0.78 * amp;
    rig.legs['-1'].rotation.x  = -s * 0.78 * amp;
    rig.arms['1'].swing.rotation.x  = -s * 0.62 * amp;
    rig.arms['-1'].swing.rotation.x =  s * 0.62 * amp;
    // 走ると腕を体に寄せて肘を張る
    rig.arms['1'].drop.rotation.z  = -1.36 + (isRun?0.20:0) * amp;
    rig.arms['-1'].drop.rotation.z =  1.36 - (isRun?0.20:0) * amp;

    // 上下動と前傾
    bobT += dt * freq * 2;
    const bob = Math.abs(Math.sin(cycle*Math.PI)) * 0.055 * amp;
    rig.inner.position.y = FOOT_Y*SCALE + bob;
    rig.inner.rotation.x = -Math.min(0.20, norm*0.26);
    rig.inner.rotation.z = Math.sin(cycle*Math.PI)*0.035*amp;

    // 待機時の呼吸
    if(speed < 0.05){
      const br = Math.sin(performance.now()*0.0016)*0.018;
      rig.inner.position.y = FOOT_Y*SCALE + br*0.5;
      if(rig.head) rig.head.rotation.x = br;
    }
  }

  // --- カメラ ---
  const headY = 1.25;
  camAim.set(player.position.x, player.position.y + headY, player.position.z);
  const cd = Math.cos(pitch);
  camPos.set(
    camAim.x - Math.sin(yaw) * cd * dist,
    camAim.y + Math.sin(pitch) * dist + 0.35,
    camAim.z - Math.cos(yaw) * cd * dist
  );
  // 建物にめり込まないよう手前に寄せる
  const dir = camPos.clone().sub(camAim);
  const len = dir.length();
  ray.set(camAim, dir.normalize());
  ray.far = len;
  const hit = ray.intersectObjects(townMeshes, false);
  if(hit.length && hit[0].distance < len){
    camPos.copy(camAim).addScaledVector(dir, Math.max(1.2, hit[0].distance - 0.4));
  }
  camera.position.lerp(camPos, Math.min(1, dt*12));
  camera.lookAt(camAim);

  // 影を追従
  sun.position.set(player.position.x + 48, 70, player.position.z + 30);
  sun.target.position.copy(player.position);

  // HUD
  const el = document.getElementById('spd');
  el.textContent = (speed*3.6).toFixed(1);
  el.classList.toggle('run', isRun && speed > 0.5);
}

/* ==================================================================
   5. ループ
   ================================================================== */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta());
  tick(dt);
  renderer.render(scene, camera);
}

/* ==================================================================
   6. 起動
   ================================================================== */
const boot = document.getElementById('boot');
const bootMsg = document.getElementById('bootMsg');
const loader = new GLTFLoader();

function start(gltf){
  // GLTFLoader は onLoad 内の例外も「読み込み失敗」に丸めてしまうため、
  // 一段外に出して本当のエラーを表示できるようにする
  setTimeout(()=>{
    try{
      buildCharacter(gltf);
      boot.style.display = 'none';
      loop();
    }catch(err){
      console.error(err);
      document.querySelector('.bar').style.display = 'none';
      bootMsg.innerHTML = 'モデルの組み立てで失敗しました。<br><code>'
        + String(err && err.message || err).slice(0,140) + '</code>';
    }
  }, 0);
}

function loadFail(){
  bootMsg.innerHTML =
    'モデルが見つかりません。<br>この HTML と同じ場所に '
    + '<code>cute_elementary_boy.glb</code> を置いてください。<br>'
    + '（<code>file://</code> で直接開いた場合も読み込めません。'
    + 'ローカルサーバか GitHub Pages 経由で開いてください）';
  document.querySelector('.bar').style.display = 'none';
  document.getElementById('pick').style.display = 'block';
}

loader.load(MODEL_URL, start, undefined, loadFail);

document.getElementById('fileIn').addEventListener('change', e=>{
  const f = e.target.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  loader.load(url, g=>{ URL.revokeObjectURL(url); start(g); },
    undefined, ()=>{ bootMsg.textContent = 'このファイルは読み込めませんでした。'; });
});
</script>
